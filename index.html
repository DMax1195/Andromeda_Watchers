<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НАБЛЮДАТЕЛИ АНДРОМЕДЫ — книга-игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>
:root{--bg:#05060e;--pn:#0c0f1d;--ln:#1c2140;--tx:#dbe4ff;--dim:#7b86b5;--ac:#8fb8ff;--rd:#ff6b8b;--am:#c9a8ff;--bl:#6ee7ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-monospace,Menlo,Consolas,monospace;width:min(100vw,calc(100dvh*9/16));margin:0 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
button:active{background:#16222e}button:disabled{opacity:.4;cursor:not-allowed}button.sel{border-color:var(--ac);color:var(--ac)}
#setup{padding:16px;overflow:auto;gap:8px}h1{font-size:20px;color:var(--ac);margin:0}h2{font-size:13px;color:var(--dim);text-transform:uppercase;margin:14px 0 4px}
.hero{display:block;width:100%;margin-bottom:6px}.hero small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.hero.sel small{color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto;text-align:center}
input{width:100%;font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
#go{width:100%;margin-top:14px;background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center}
#top{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--pn);border-bottom:1px solid var(--ln)}
.tl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}.tl+.tl{margin-top:6px}
.bar{flex:1;height:9px;background:#1a2530;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.tl b{min-width:70px;color:var(--tx);font-weight:400}.tl button{padding:5px 9px;font-size:13px}
#chat{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.m.in{background:var(--pn);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:3px}.m.in b{display:block;font-size:11px;color:var(--ac)}
.m.out{background:#27306b;align-self:flex-end;border-bottom-right-radius:3px}
.m.sys{align-self:center;max-width:95%;font-size:12px;color:var(--am);text-align:center;padding:0}.m.sys.bad{color:var(--rd)}
#typ{color:var(--dim);font-size:12px;padding:0 12px 4px;height:20px}
#bot{padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:6px;min-height:64px}
#wait{text-align:center;color:var(--am);padding:12px 0;cursor:pointer;user-select:none;border-radius:7px}#wait:active{background:#1b2038;color:#fff}.ch small{color:var(--dim)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:10000;pointer-events:none;touch-action:manipulation}#modal.on{display:flex;pointer-events:auto}
#mb{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;width:100%;max-width:460px;max-height:min(82dvh,760px);overflow:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch;display:flex;flex-direction:column;gap:8px}
#mb h3{margin:0;color:var(--ac);font-size:15px}#mb p{margin:0;color:var(--dim)}#mb.dead h3{color:var(--rd);font-size:18px}
/* Интерактивное оглавление журнала */
.toc{display:flex;flex-direction:column;gap:5px;max-height:42vh;min-height:0;flex:0 0 auto;overflow:auto;padding-right:3px;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
.toc-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid var(--ln);background:#090d19;text-align:left}
.toc-item .toc-mark{flex:0 0 23px;text-align:center;font-size:16px;color:var(--dim)}
.toc-item .toc-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.toc-item .toc-name{color:var(--tx);font-size:13px;font-weight:700}
.toc-item .toc-pages{color:var(--dim);font-size:11px}
.toc-item.done{border-color:#31534a}.toc-item.done .toc-mark{color:#83d6a5}
.toc-item.current{border-color:var(--ac);background:#17213a;box-shadow:inset 3px 0 var(--ac)}.toc-item.current .toc-mark,.toc-item.current .toc-name{color:var(--ac)}
.toc-item.locked{opacity:.52;cursor:not-allowed}
.toc-summary{padding:7px 10px 9px 42px;color:#aebbdc;font:italic 12px/1.5 Lora,Georgia,serif;border-left:1px solid var(--ln);margin:0 0 3px 11px}
.journal-note{padding:7px 9px;border-left:2px solid var(--ln);background:#090d19;color:var(--tx)!important;font-size:12px;line-height:1.5;border-radius:0 6px 6px 0}.journal-note-new{border-left-color:var(--am);background:#171329;color:#e5d9ff!important}
.toc-legend{font-size:11px;color:var(--dim);line-height:1.7}

.dossier-list{display:flex;flex-direction:column;gap:8px;margin:0 0 4px}
.dossier-card{padding:11px 12px;border:1px solid #26304b;border-left:2px solid #6f91c9;border-radius:8px;background:linear-gradient(145deg,#111829,#0a101d);display:flex;flex-direction:column;gap:5px}
.dossier-card .dossier-name{color:#dce7ff;font-size:14px;font-weight:700;letter-spacing:.02em}
.dossier-card .dossier-role{color:#8fa6d2;font-size:11px;text-transform:uppercase;letter-spacing:.06em}
.dossier-card .dossier-desc{color:#c4cee4;font:13px/1.55 Lora,Georgia,serif}
.dossier-facts{display:flex;flex-direction:column;gap:4px;margin-top:3px;padding-top:7px;border-top:1px solid #202a40}
.dossier-facts:before{content:"ЗАПИСИ ПО ХОДУ ИСТОРИИ";color:#8f9fc2;font:700 9px/1.4 ui-monospace,monospace;letter-spacing:.08em}
.dossier-fact{margin:0;padding-left:10px;border-left:2px solid #8b79bd;color:#c5b9e8;font-size:11px;line-height:1.45}
.dossier-hint{padding:8px 10px;border:1px dashed #2a3550;border-radius:7px;color:#8491b5;font:italic 12px/1.5 Lora,Georgia,serif}
.temporal-panel{padding:10px;border:1px solid #37486a;border-left:3px solid #8fb8ff;border-radius:8px;background:linear-gradient(145deg,#111a2c,#090e1b);display:flex;flex-direction:column;gap:7px}
.temporal-panel strong{color:#d8e8ff;font-size:12px;letter-spacing:.04em}
.temporal-panel p{margin:0;color:#b8c7e5;font:12px/1.55 Lora,Georgia,serif}
.temporal-locked{border-left-color:#8a718d;background:#151221}
.temporal-branch{padding:9px;border:1px solid #283652;border-radius:7px;background:#090e1a;display:flex;flex-direction:column;gap:5px}
.temporal-branch b{color:#d8e8ff;font-size:12px}
.temporal-branch small{color:#8799bd;font-size:10px;line-height:1.45}
.temporal-branch button{width:100%;text-align:center}
.t2-line{padding:8px 10px;border-radius:9px;background:#101a2b;border-left:2px solid #c9a8ff;font:13px/1.55 Lora,Georgia,serif;color:#d6def2}
.t2-line.user{margin-left:18px;background:#17233a;border-left-color:#8fb8ff;color:#e2edff}
.t2-status{display:flex;gap:6px;flex-wrap:wrap}
.t2-status span{font-size:10px;padding:4px 8px;border:1px solid #33415d;border-radius:12px;color:#b9c7e2}
.temporal-note{color:#8f9fc2;font-size:10px;line-height:1.5}

.inv-entry{display:flex;flex-direction:column;gap:6px;padding:10px;border:1px solid #283652;border-left:3px solid #8fb8ff;border-radius:8px;background:linear-gradient(145deg,#111a2a,#090f1b)}.inv-entry .inv-name{color:#e3edff;font-size:13px}.inv-entry p{margin:0;color:#c2cde3;font:12px/1.5 Lora,Georgia,serif}.inv-entry .inv-state{color:#9eadd0;font-size:10px;letter-spacing:.04em}.inv-entry button{width:100%;margin-top:2px;text-align:center;border-color:#40557c;background:#17233a}.inv-entry button:disabled{opacity:.42}


#loader,#splash,#prologue{align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.ld-t{font:700 22px Oswald,Impact,sans-serif;letter-spacing:.35em;color:var(--ac);animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.45}}
.ld-bar{width:70%;height:4px;background:#1a2530;border-radius:2px;overflow:hidden;margin:20px auto 10px}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fb8ff,#d6b8ff);transition:width .5s}
#ldlog{color:var(--dim);font-size:12px;height:18px}
.cred{color:var(--dim);font-size:11px;letter-spacing:.08em;text-align:center;padding:4px 8px}
#snow{position:absolute;inset:0;width:100%;height:100%}
.in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.kick{font:500 12px Oswald,sans-serif;letter-spacing:.5em;color:var(--am)}
.ttl{font:700 clamp(34px,11.5vw,72px)/1 Oswald,Impact,sans-serif;letter-spacing:.06em;margin:0;background:linear-gradient(180deg,#ffffff,#b9c8ff 50%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.8s ease-out both,glow 4s ease-in-out 1.8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96);letter-spacing:.35em}}@keyframes glow{50%{filter:drop-shadow(0 0 16px #8fb8ffaa)}}
.sub{font:italic 17px Lora,Georgia,serif;color:#9fb6c6;animation:fi 2s 1s both}@keyframes fi{from{opacity:0}}
button.big{background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center;width:100%;max-width:320px;letter-spacing:.1em;animation:fi 2s 1.6s both}
#pr{max-width:440px}.pp{font:italic 17px/1.7 Lora,Georgia,serif;color:#c3d6e2;opacity:0;animation:fi 1.4s forwards;margin:0 0 14px}
#prGo.pp{font:700 15px Oswald,sans-serif;font-style:normal;color:#07102a}
/* --- книжная вёрстка: абзацы, прямая речь, разделитель сцен --- */
.m.nar,.m.spk{align-self:stretch;max-width:100%;background:none;border:0;border-radius:0;padding:0 2px;font:400 16px/1.75 Lora,Georgia,serif;color:#c3d0ee;text-align:justify;text-indent:1.6em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.m.spk{color:#e8eeff}.m.spk .dash{color:var(--am);font-weight:600}
.m.nar+.m.nar,.m.nar+.m.spk,.m.spk+.m.nar,.m.spk+.m.spk{margin-top:-5px}
.m.hd+.m.nar,.m.hd+.m.spk,.m.sep+.m.nar,.m.sep+.m.spk{text-indent:0}
#final{padding:16px;overflow:auto}#fn{display:flex;flex-direction:column;gap:6px}
#fn h3{font:600 13px Oswald,sans-serif;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:14px 0 2px}
.fh{font:700 30px/1.15 Oswald,Impact,sans-serif;color:var(--ac);margin:0}.fh.bad{color:var(--rd)}.fs{color:var(--am);font-size:13px}
.fe{font:italic 16px/1.7 Lora,Georgia,serif;color:#c3d6e2;margin:8px 0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}.kv b{font-weight:400;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--ln);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--dim)}
#chs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
#chs::-webkit-scrollbar{width:6px}#chs::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px}
#chs button{flex:0 0 auto;scroll-snap-align:start;padding:8px 10px;font-size:14px;line-height:1.35}
#chs button.more{text-align:center;background:var(--ac);color:#07102a;font-weight:700;letter-spacing:.04em;border:0}
#chh{font-size:11px;color:var(--am);text-align:center;letter-spacing:.05em}
html{background:#02030a}body{height:100dvh;overflow:hidden}
@media (min-aspect-ratio:3/4){body{border-left:1px solid var(--ln);border-right:1px solid var(--ln)}}
#splash,#prologue{overflow-y:auto}.blurb{font:italic 14px/1.55 Lora,Georgia,serif;color:#b8c4ea;max-width:400px;animation:fi 2s 1.2s both}
.m.hd{position:static;inset:auto;z-index:auto;align-self:stretch;max-width:100%;text-align:center;padding:18px 0 8px;animation:fi 1s}.m.hd small{display:block;letter-spacing:.3em;color:var(--am);font-size:11px}
.m.hd h4{font:700 26px/1.15 Oswald,Impact,sans-serif;margin:6px 0 0;color:var(--tx);letter-spacing:.08em;text-transform:uppercase}
/* --- обложка, страницы, разделители --- */
#splash{overflow:hidden;justify-content:stretch;align-items:stretch;padding:0;text-align:center;min-height:0}

#splash .in.scroll-needed{justify-content:flex-start;padding-top:max(10px,env(safe-area-inset-top,0px))}
#splash .in::-webkit-scrollbar{display:none}
#splash .ttl{width:100%;font-size:clamp(2rem,9.6vw,3.3rem);line-height:1.02;letter-spacing:.055em;overflow-wrap:anywhere;filter:drop-shadow(0 0 10px #4da3ff99)}

#splash .cred{font-size:clamp(7px,1.83vw,10px);line-height:1.35}

.pg:empty{display:none}.pg::after{content:"";display:block;height:2px;margin-top:5px;border-radius:1px;background:linear-gradient(90deg,var(--am) var(--p,0%),var(--ln) 0)}
.m.sep{align-self:stretch;max-width:100%;text-align:center;color:var(--dim);font:400 22px/1 Lora,Georgia,serif;letter-spacing:.45em;text-indent:.45em;padding:16px 0 12px;opacity:.9}

/* --- Мобильная компоновка: фиксированные панели, прокрутка только текста --- */
html, body { height: 100%; min-height: 0; }
body {
  height: 100dvh; max-height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
#game {
  width: 100%; height: 100%; max-height: 100dvh; min-height: 0;
  flex: 1 1 0; overflow: hidden; flex-direction: column;
}
/* ВАЖНО: #game не должен обходить display:none у .scr.
   Экран игры становится flex-контейнером только после добавления .on функцией show(). */
#game.on { display: flex; }
#game:not(.on) { display: none !important; }
#game > #top, #game > #credG, #game > #typ, #game > #bot {
  flex: 0 0 auto; min-height: 0;
}
#game > #chat {
  flex: 1 1 0; min-height: 0; max-height: none;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
#game > #bot { flex-shrink: 0; overflow: visible; }
#top { position: relative; z-index: 4; }
#bLog { position: relative; z-index: 5; flex: 0 0 40px; min-width: 40px; min-height: 36px; display: inline-flex; align-items: center; justify-content: center; touch-action: manipulation; }
.journal-badge { position: absolute; top: -5px; right: -5px; min-width: 16px; height: 16px; padding: 0 4px; border-radius: 10px; background: var(--rd); color: #160710; font: 700 10px/16px ui-monospace,monospace; text-align: center; box-shadow: 0 0 0 2px var(--pn); }
#game #chs {
  max-height: none !important; overflow: visible; overscroll-behavior: auto;
  scroll-snap-type: none; scrollbar-width: none;
}
#game #chs::-webkit-scrollbar { display: none; }
#game #chs button { flex: 0 0 auto; }

/* --- Пролог появляется полностью сразу; длинный текст прокручивается внутри --- */
#prologue .in {
  width: 100%; max-height: 100%; min-height: 0;
  overflow-x: hidden; overflow-y: auto; align-items: stretch;
  justify-content: flex-start;
  padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: thin;
}
#prologue .kick { text-align: center; }
#prologue #pr { width: 100%; max-width: 520px; margin: 0 auto; }
#prologue .pp { opacity: 1; animation: none; }
#prologue #pr .pp {
  font: italic 16px/1.75 Lora, Georgia, serif; color: #c3d6e2;
  text-align: justify; text-indent: 1.4em; margin: 0 0 14px;
}
#prologue #prGo {
  opacity: 1; animation: none; align-self: center; margin: 10px auto 0;
}

  nodes: {
    c01_01: {

      page: "Стр. 1–6",
      messages: [
        "В галактике Андромеды тишина имеет вес. Она не пустая, как думают те, кто никогда не покидал пределов своей атмосферы, — она плотная, насыщенная холодом далёких белых карликов и гулом гравитационных волн. Аэ́рхис привык слушать эту тишину с первого цикла своего пробуждения. Но сейчас вокруг него не было ни звёзд, ни привычной вибрации корпуса разведывательного челнока. Была только вода. Ледяная, тяжёлая, чужая.",
        "Океан Земли сдавливал грудную клетку так, словно пытался выдавить из него саму память о доме. Солёная темнота обжигала глаза, а каждый вдох через аварийный ребризер отзывался металлическим привкусом крови и озона. Обломки челнока остались далеко позади, сгорев в плотных слоях атмосферы или уйдя на многокилометровую глубину, а здесь, в чёрной толще северных вод, оставался только холод.",
        "Рядом, почти касаясь его плеча, в воде завис Лиор’Саэн. Его тёмная, похожая на оплавленное обсидиановое стекло оболочка покрылась паутиной тонких серебристо-голубых трещин. В глубине этих линий медленно пульсировал холодный свет, отгоняя от них обоих панику и замедляя ледяное оцепенение. Лиор’Саэн не говорил словами — он протянул к сознанию Аэ́рхиса тонкую нить спокойствия, указывая вверх, туда, где сквозь ревущую толщу волн пробивался чужеродный механический рокот.",
        { from: "Аэ́рхис", t: "— Слышишь это эхо, Лиор’Саэн? — мысленно спрашивает Аэ́рхис, с трудом разжимая сведённые судорогой пальцы. — Это не обломки нашего челнока. Слишком ритмично. Слишком тяжело. Над нами идут живые существа." },

      ],

    c01_02: {

      messages: [
        { sep: true },
        "Когда тяжёлые, пахнущие мазутом и мокрой шерстью руки вытащили их на палубу траулера «Северный горизонт», мир вокруг взорвался звуками. Ледяной ветер срывал с гребней волн солёную пену, скрипели стальные лебёдки, а вокруг сгрудились люди в прорезиненных оранжевых робах. Они кричали друг другу что-то на гортанном, резком языке, но в их голосах не было ни злобы, ни охотничьего азарта — только хриплая, суетливая тревога спасателей.",

        { from: "Молодой матрос", t: "— Капитан, гляньте на его виски... и на эту чёрную штуку рядом с ним! — вскрикивает молодой матрос с перевязанной щекой, пятясь к фальшборту. — Это же не человек, Брандт! Что мы вытащили из бездны?!" },

Object.entries(CHOICE_OUTCOMES).forEach(([nodeId, texts]) => {
  const node = STORY_DATA.nodes[nodeId];
  if (!node || !Array.isArray(node.choices)) return;
  node.choices.forEach((choice, index) => {
    if (texts[index]) {
      choice.choiceId = nodeId + '#' + (index + 1);
      choice.outcomeText = texts[index];
      choice.outcomeTitle = 'Последствие решения';
    }
  });
});

// Разблокировка строится по фактически достигнутому сюжетному узлу.
// Для промежуточных узлов сохраняются все встречи, которые идут раньше по истории.
function dossierIdsThroughNode(nodeId) {
  const ids = ["aerkhis", "liorsaen"];
  const current = String(nodeId || "").match(/^c(\d+)_(\d+)(?:_[a-z0-9]+)?$/i);
  if (!current) return ids;
  const currentChapter = Number(current[1]);
  const currentScene = Number(current[2]);
  Object.entries(DOSSIER_UNLOCKS).forEach(([unlockNode, dossierIds]) => {
    const point = unlockNode.match(/^c(\d+)_(\d+)$/);
    if (!point) return;
    const chapter = Number(point[1]);
    const scene = Number(point[2]);
    if (chapter < currentChapter || (chapter === currentChapter && scene <= currentScene)) {
      dossierIds.forEach(id => { if (!ids.includes(id)) ids.push(id); });
    }
  });
  return ids.filter(id => DOSSIER_DATA.some(d => d.id === id));
}

function ensureDossierList() {
  const expected = dossierIdsThroughNode(st.node);
  const changed = !Array.isArray(st.dossiers) ||
    st.dossiers.length !== expected.length ||
    expected.some(id => !st.dossiers.includes(id));
  st.dossiers = expected;
  return changed;
}

function unlockDossiersForNode(nodeId) {
  const previous = Array.isArray(st.dossiers) ? st.dossiers.join("|") : "";
  st.dossiers = dossierIdsThroughNode(nodeId);
  if (previous !== st.dossiers.join("|")) save();
}

  if (ensureDossierList()) save();
}

function chronologyChapter(nodeId) {
  const match = String(nodeId || "").match(/^c(\d+)_/i);
  return match ? Math.max(1, Math.min(19, Number(match[1]))) : null;
}

function forkFromSavedTimeline(line, decisionIndex) {
  if (!isChronicleUnlocked() || !line || !Array.isArray(line.decisions)) return false;

  ensureMetaProgress();
  if (!Array.isArray(metaProgress.pausedLines)) metaProgress.pausedLines = [];

    metaProgress.pausedLines.unshift({
      timelineId:Number(st.activeTimelineId || st.timelineId) || 1,
      pausedAt:Date.now(),
      currentSnapshot:JSON.parse(JSON.stringify(st)),
      ...summarizeCurrentRun()

  }
  const restored=JSON.parse(JSON.stringify(entry.snapshot));
  const newId=Number(metaProgress.nextTimelineId)||2;

  st=restored;
  st.timelineId=newId; st.activeTimelineId=newId;
  ensureTimelineState(st);
  st.decisionHistory=line.decisions.slice(0,decisionIndex).map(d=>JSON.parse(JSON.stringify(d)));

  if (Array.isArray(st.realtimeInbox)) st.realtimeInbox.forEach(ev=>{ev.timelineId=newId;});
  applyT2Carryover(st);
  run++; skip=false; holdRun=0;
  $('#modal').classList.remove('on'); $('#modal').setAttribute('aria-hidden','true');
  $('#chat').innerHTML=''; st.chat.forEach(draw);
  add('sys','[ХРОНОЛОГИЯ: создана линия №'+newId+' из сохранённой линии №'+(line.timelineId||line.id||'—')+'. Состояние восстановлено точно до выбранного решения.]');
  speakT2OnTimelineJump();

    const r = line.resources || line.endpoint || {};

    if (Array.isArray(r.inventory) && r.inventory.length) m.append(el("p", "Инвентарь: " + r.inventory.join(", ")));
  });
}

function collectChronologyEntries() {
  ensureMetaProgress();
  const entries = [];
  const seen = new Set();
  const add = (kind, data, label, key) => {
    if (!data || typeof data !== "object") return;
    const unique = key || (kind + ":" + (data.timelineId || data.id || entries.length) + ":" + (data.endingId || data.forkNode || ""));
    if (seen.has(unique)) return;
    seen.add(unique);
    entries.push({kind, data, label: label || ("Линия №" + (data.timelineId || data.id || "—"))});
  };
  const appendSavedRun = saved => {
    if (!saved || typeof saved !== "object") return;
    (Array.isArray(saved.timelines) ? saved.timelines : []).forEach(line => {
      add("completed", line, "Линия №" + (line.timelineId || "—") + " · " + (line.endingTitle || "завершена"), "line:" + (line.timelineId || "") + ":" + (line.endingId || ""));
    });
    // Текущая сохранённая ветка тоже доступна для просмотра, даже если финал ещё не достигнут.
    if (saved.node && !saved.dead) {
      const active = {...saved,
        decisions: Array.isArray(saved.decisionHistory) ? saved.decisionHistory : [],
        visitedNodes: Array.isArray(saved.visitedNodes) ? saved.visitedNodes : [],
        storyMoments: Array.isArray(saved.storyMoments) ? saved.storyMoments : [],
        resources: {hp:saved.hp,o2:saved.o2,en:saved.en,ammo:saved.ammo,inventory:Array.isArray(saved.inv)?saved.inv:[]}
      };
      add("active", active, "Текущая линия №" + (saved.activeTimelineId || saved.timelineId || 1), "active:" + (saved.activeTimelineId || saved.timelineId || 1));
    }
  };
  if (st) appendSavedRun(st);
  try {
    const saved = JSON.parse(lsGet(KEY) || "null");
    if (saved && saved !== st) appendSavedRun(saved);
  } catch (e) {}
  (metaProgress.completedRoutes || []).forEach(line => {
    add("completed", line, "Линия №" + (line.timelineId || "—") + " · " + (line.endingTitle || "завершена"), "line:" + (line.timelineId || "") + ":" + (line.endingId || ""));
  });
  (metaProgress.alternateLines || []).forEach(line => {
    add("alternate", line, "Ответвление №" + (line.forkedIntoTimelineId || line.id || "—"), "alternate:" + (line.archiveId || line.id || entries.length));
  });
  (metaProgress.pausedLines || []).forEach((line, i) => {
    add("paused", line, "Приостановленная линия №" + (line.timelineId || "—"), "paused:" + (line.timelineId || "") + ":" + (line.pausedAt || i));
  });
  return entries;
}

  processT2Replies(Date.now());

  }

    t2.messages.push({from:"T2", at:Date.now(), text:observation, context:"chronology"});
    t2.messages = t2.messages.slice(-TEMPORAL_RULES.maxT2Messages);
  }
  t2.unreadReplies = 0;

      item.className = "t2-line" + (line.from === "Вы" ? " user" : "");
      transcript.append(item);
    });
    observer.append(transcript);

    const t2Wait = Math.max(0, Number(t2.nextActionAt || 0) - Date.now());
    if (t2Wait > 0 || (t2.pendingReplies || []).some(x => Number(x.dueAt) > Date.now())) {
      const pending = el("p", "Т2 обрабатывает предыдущий ответ. Следующий сигнал ожидается через " + formatRemaining(t2Wait) + ". Вы можете открыть полный канал, не сбрасывая ожидание.");
      pending.className = "temporal-note"; observer.append(pending);
    } else {
      observer.append(el("p", "Ответьте Т2 сейчас. Ваш выбор изменит его отношение и повлияет на последующие временные линии."));
      [["help","✦ Попытаться спасти всех и помочь Т2"],["experiment","⟁ Провести жестокий эксперимент"],["argue","⌁ Оспорить выводы Т2"]].forEach(([action,label]) => {
        const reply = el("button", label); reply.type = "button"; reply.onclick = () => chooseT2(action); observer.append(reply);
      });
    }
    const fullChannel = el("button", "Открыть полный диалог с Т2");

        });

    };

    openLine.onclick = () => showEntry(entries[Number(select.value)]);
    m.append(openLine);
    if (!entries.length) {

      empty.className = "temporal-note"; m.append(empty);

      const summary = el("p", "Сохранённых веток: " + entries.length + ". Просмотр архива не меняет активное прохождение. Изменение прошлых решений создаёт отдельную временную линию.");
      summary.className = "temporal-note"; m.append(summary);

    const close = el("button", "Вернуться на начальный экран"); close.type = "button";
    close.onclick = () => { $("#modal").classList.remove("on"); $("#modal").setAttribute("aria-hidden", "true"); show("splash"); };
    m.append(close);
  });
}

function loadCover() {
  const cover = document.querySelector(".cv");
  if (!cover) return;
  // Сначала показываем локальный cover.png из той же папки, затем пробуем cover.jpg.
  // Резервную галактику включаем только если оба файла действительно недоступны.
  cover.classList.remove("fallback");
  const candidates = ["./cover.png", "./cover.jpg"];
  let index = 0;
  const tryNext = () => {
    if (index >= candidates.length) {
      // Ни одного внешнего файла нет: остаётся встроенная обложка из референса.
      cover.classList.remove("fallback");
      return;
    }
    const src = candidates[index++];
    const image = new window.Image();
    image.onload = () => {
      cover.style.backgroundImage = 'url("' + src + '")';
      cover.classList.remove("fallback");
      fitSplash();
    };
    image.onerror = tryNext;
    image.src = src;
  };
  tryNext();
}

function fitSplash() {
  const root = $("#splash"), inner = root && root.querySelector(".in");
  if (!root || !inner || !root.classList.contains("on")) return;
  inner.classList.remove("scroll-needed");
  const needsScroll = inner.scrollHeight > inner.clientHeight + 2;
  inner.classList.toggle("scroll-needed", needsScroll);
  if (!needsScroll) inner.scrollTop = 0;
}

function snow() {
  const c = $("#snow"), x = c.getContext("2d"), W = c.width = c.parentNode.clientWidth, H = c.height = c.parentNode.clientHeight;
  const p = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * .25 + .05, ph: Math.random() * 6.3, sp: Math.random() * .03 + .01, col: Math.random() < .3 ? "214,184,255" : "143,184,255" }));
  (function f() { if (!$("#splash").classList.contains("on")) return; x.clearRect(0, 0, W, H);
    p.forEach(q => { q.ph += q.sp; q.y -= q.v; q.x += Math.sin(q.ph) * .15; if (q.y < -4) { q.y = H + 4; q.x = Math.random() * W; }
      const a = .25 + .75 * Math.abs(Math.sin(q.ph * 1.7)); x.fillStyle = "rgba(" + q.col + "," + a.toFixed(2) + ")"; x.shadowColor = "rgba(" + q.col + ",.9)"; x.shadowBlur = q.r * 5;
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.3); x.fill(); }); requestAnimationFrame(f); })();
}
