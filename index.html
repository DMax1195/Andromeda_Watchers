<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НАБЛЮДАТЕЛИ АНДРОМЕДЫ — книга-игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>
:root{--bg:#05060e;--pn:#0c0f1d;--ln:#1c2140;--tx:#dbe4ff;--dim:#7b86b5;--ac:#8fb8ff;--rd:#ff6b8b;--am:#c9a8ff;--bl:#6ee7ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-monospace,Menlo,Consolas,monospace;width:min(100vw,calc(100dvh*9/16));margin:0 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
button:active{background:#16222e}button:disabled{opacity:.4;cursor:not-allowed}button.sel{border-color:var(--ac);color:var(--ac)}
#setup{padding:16px;overflow:auto;gap:8px}h1{font-size:20px;color:var(--ac);margin:0}h2{font-size:13px;color:var(--dim);text-transform:uppercase;margin:14px 0 4px}
.hero{display:block;width:100%;margin-bottom:6px}.hero small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.hero.sel small{color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto;text-align:center}
input{width:100%;font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
#go{width:100%;margin-top:14px;background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center}
#top{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--pn);border-bottom:1px solid var(--ln)}
.tl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}.tl+.tl{margin-top:6px}
.bar{flex:1;height:9px;background:#1a2530;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.tl b{min-width:70px;color:var(--tx);font-weight:400}.tl button{padding:5px 9px;font-size:13px}
#chat{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.m.in{background:var(--pn);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:3px}.m.in b{display:block;font-size:11px;color:var(--ac)}
.m.out{background:#27306b;align-self:flex-end;border-bottom-right-radius:3px}
.m.sys{align-self:center;max-width:95%;font-size:12px;color:var(--am);text-align:center;padding:0}.m.sys.bad{color:var(--rd)}
#typ{color:var(--dim);font-size:12px;padding:0 12px 4px;height:20px}
#bot{padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:6px;min-height:64px}
#wait{text-align:center;color:var(--am);padding:12px 0}.ch small{color:var(--dim)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal.on{display:flex}
#mb{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;width:100%;max-width:460px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#mb h3{margin:0;color:var(--ac);font-size:15px}#mb p{margin:0;color:var(--dim)}#mb.dead h3{color:var(--rd);font-size:18px}
/* Интерактивное оглавление журнала */
.toc{display:flex;flex-direction:column;gap:5px;max-height:42vh;overflow:auto;padding-right:3px}
.toc-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid var(--ln);background:#090d19;text-align:left}
.toc-item .toc-mark{flex:0 0 23px;text-align:center;font-size:16px;color:var(--dim)}
.toc-item .toc-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.toc-item .toc-name{color:var(--tx);font-size:13px;font-weight:700}
.toc-item .toc-pages{color:var(--dim);font-size:11px}
.toc-item.done{border-color:#31534a}.toc-item.done .toc-mark{color:#83d6a5}
.toc-item.current{border-color:var(--ac);background:#17213a;box-shadow:inset 3px 0 var(--ac)}.toc-item.current .toc-mark,.toc-item.current .toc-name{color:var(--ac)}
.toc-item.locked{opacity:.52;cursor:not-allowed}
.toc-summary{padding:7px 10px 9px 42px;color:#aebbdc;font:italic 12px/1.5 Lora,Georgia,serif;border-left:1px solid var(--ln);margin:0 0 3px 11px}
.toc-legend{font-size:11px;color:var(--dim);line-height:1.7}

#loader,#splash,#prologue{align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.ld-t{font:700 22px Oswald,Impact,sans-serif;letter-spacing:.35em;color:var(--ac);animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.45}}
.ld-bar{width:70%;height:4px;background:#1a2530;border-radius:2px;overflow:hidden;margin:20px auto 10px}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fb8ff,#d6b8ff);transition:width .5s}
#ldlog{color:var(--dim);font-size:12px;height:18px}
.cred{color:var(--dim);font-size:11px;letter-spacing:.08em;text-align:center;padding:4px 8px}
#snow{position:absolute;inset:0;width:100%;height:100%}
.in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.kick{font:500 12px Oswald,sans-serif;letter-spacing:.5em;color:var(--am)}
.ttl{font:700 clamp(34px,11.5vw,72px)/1 Oswald,Impact,sans-serif;letter-spacing:.06em;margin:0;background:linear-gradient(180deg,#ffffff,#b9c8ff 50%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.8s ease-out both,glow 4s ease-in-out 1.8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96);letter-spacing:.35em}}@keyframes glow{50%{filter:drop-shadow(0 0 16px #8fb8ffaa)}}
.sub{font:italic 17px Lora,Georgia,serif;color:#9fb6c6;animation:fi 2s 1s both}@keyframes fi{from{opacity:0}}
button.big{background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center;width:100%;max-width:320px;letter-spacing:.1em;animation:fi 2s 1.6s both}
#pr{max-width:440px}.pp{font:italic 17px/1.7 Lora,Georgia,serif;color:#c3d6e2;opacity:0;animation:fi 1.4s forwards;margin:0 0 14px}
#prGo.pp{font:700 15px Oswald,sans-serif;font-style:normal;color:#07102a}
/* --- книжная вёрстка: абзацы, прямая речь, разделитель сцен --- */
.m.nar,.m.spk{align-self:stretch;max-width:100%;background:none;border:0;border-radius:0;padding:0 2px;font:400 16px/1.75 Lora,Georgia,serif;color:#c3d0ee;text-align:justify;text-indent:1.6em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.m.spk{color:#e8eeff}.m.spk .dash{color:var(--am);font-weight:600}
.m.nar+.m.nar,.m.nar+.m.spk,.m.spk+.m.nar,.m.spk+.m.spk{margin-top:-5px}
.m.hd+.m.nar,.m.hd+.m.spk,.m.sep+.m.nar,.m.sep+.m.spk{text-indent:0}
#final{padding:16px;overflow:auto}#fn{display:flex;flex-direction:column;gap:6px}
#fn h3{font:600 13px Oswald,sans-serif;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:14px 0 2px}
.fh{font:700 30px/1.15 Oswald,Impact,sans-serif;color:var(--ac);margin:0}.fh.bad{color:var(--rd)}.fs{color:var(--am);font-size:13px}
.fe{font:italic 16px/1.7 Lora,Georgia,serif;color:#c3d6e2;margin:8px 0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}.kv b{font-weight:400;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--ln);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--dim)}
#chs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
#chs::-webkit-scrollbar{width:6px}#chs::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px}
#chs button{flex:0 0 auto;scroll-snap-align:start;padding:8px 10px;font-size:14px;line-height:1.35}
#chs button.more{text-align:center;background:var(--ac);color:#07102a;font-weight:700;letter-spacing:.04em;border:0}
#chh{font-size:11px;color:var(--am);text-align:center;letter-spacing:.05em}
html{background:#02030a}body{height:100dvh;overflow:hidden}
@media (min-aspect-ratio:3/4){body{border-left:1px solid var(--ln);border-right:1px solid var(--ln)}}
#splash,#prologue{overflow-y:auto}.blurb{font:italic 14px/1.55 Lora,Georgia,serif;color:#b8c4ea;max-width:400px;animation:fi 2s 1.2s both}
.m.hd{align-self:stretch;max-width:100%;text-align:center;padding:18px 0 8px;animation:fi 1s}.m.hd small{display:block;letter-spacing:.3em;color:var(--am);font-size:11px}
.m.hd h4{font:700 26px/1.15 Oswald,Impact,sans-serif;margin:6px 0 0;color:var(--tx);letter-spacing:.08em;text-transform:uppercase}
/* --- обложка, страницы, разделители --- */
#splash{overflow:hidden;justify-content:flex-end;padding:0;text-align:center}
.cv{position:absolute;inset:-5%;background-color:#02030a;background-position:center 22%;background-size:cover;background-repeat:no-repeat;animation:breathe 24s ease-in-out infinite alternate;will-change:transform}
@keyframes breathe{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.13) translate3d(-1.5%,-2%,0)}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#02030a 0%,#02030af2 34%,#02030ab3 56%,#02030a40 74%,transparent 90%),radial-gradient(ellipse at 50% 18%,#2a6dff22,transparent 60%)}
#snow{pointer-events:none}
#splash .in{max-height:100%;overflow-y:auto;padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px));gap:12px;scrollbar-width:none}
#splash .in::-webkit-scrollbar{display:none}
.ttl{font-size:clamp(28px,9vw,56px);line-height:1.08;filter:drop-shadow(0 0 10px #4da3ff99)}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #5aaaffee) drop-shadow(0 0 44px #2a6dffaa)}}
#splash .blurb{color:#d3dcff;text-shadow:0 1px 6px #000}
#splash .cred,#splash .sub,#splash .kick{text-shadow:0 1px 5px #000}
.pg{margin-top:6px;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--am)}
.pg:empty{display:none}.pg::after{content:"";display:block;height:2px;margin-top:5px;border-radius:1px;background:linear-gradient(90deg,var(--am) var(--p,0%),var(--ln) 0)}
.m.sep{align-self:stretch;max-width:100%;text-align:center;color:var(--dim);font:400 22px/1 Lora,Georgia,serif;letter-spacing:.45em;text-indent:.45em;padding:16px 0 12px;opacity:.9}

/* --- Мобильная компоновка: фиксированные панели, прокрутка только текста --- */
html, body { height: 100%; min-height: 0; }
body {
  height: 100dvh; max-height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
#game {
  width: 100%; height: 100%; max-height: 100dvh; min-height: 0;
  flex: 1 1 0; overflow: hidden; flex-direction: column;
}
/* ВАЖНО: #game не должен обходить display:none у .scr.
   Экран игры становится flex-контейнером только после добавления .on функцией show(). */
#game.on { display: flex; }
#game:not(.on) { display: none !important; }
#game > #top, #game > #credG, #game > #typ, #game > #bot {
  flex: 0 0 auto; min-height: 0;
}
#game > #chat {
  flex: 1 1 0; min-height: 0; max-height: none;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
#game > #bot { flex-shrink: 0; overflow: visible; }
#game #chs {
  max-height: none !important; overflow: visible; overscroll-behavior: auto;
  scroll-snap-type: none; scrollbar-width: none;
}
#game #chs::-webkit-scrollbar { display: none; }
#game #chs button { flex: 0 0 auto; }

/* --- Пролог появляется полностью сразу; длинный текст прокручивается внутри --- */
#prologue .in {
  width: 100%; max-height: 100%; min-height: 0;
  overflow-x: hidden; overflow-y: auto; align-items: stretch;
  justify-content: flex-start;
  padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: thin;
}
#prologue .kick { text-align: center; }
#prologue #pr { width: 100%; max-width: 520px; margin: 0 auto; }
#prologue .pp { opacity: 1; animation: none; }
#prologue #pr .pp {
  font: italic 16px/1.75 Lora, Georgia, serif; color: #c3d6e2;
  text-align: justify; text-indent: 1.4em; margin: 0 0 14px;
}
#prologue #prGo {
  opacity: 1; animation: none; align-self: center; margin: 10px auto 0;
}

/* --- Обложка: прокручиваемое содержимое и компактная типографика --- */
#splash {
  overflow-x: hidden;
  overflow-y: auto;
  justify-content: flex-start;
  padding: 20px 16px 40px;
  -webkit-overflow-scrolling: touch;
  overscroll-behavior-y: contain;
}
#splash .in {
  flex: 0 0 auto;
  width: 100%;
  max-height: none;
  overflow: visible;
  padding: 0;
  gap: 10px;
}
#splash .ttl {
  width: 100%;
  font-size: clamp(1.6rem, 6vw, 2.4rem);
  line-height: 1.12;
  overflow-wrap: anywhere;
}
#splash .blurb { font-size: .92rem; line-height: 1.5; }
#splash button.big { flex: 0 0 auto; min-height: 46px; opacity: 1; animation: none; }
#snow { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }

/* Телеметрия и нижняя игровая панель доступны только внутри игрового канала. */
#game > #top[hidden], #game > #bot[hidden] { display: none !important; }

/* Резервная обложка: далёкая галактика и Земля, если локальных картинок нет. */
.cv.fallback {
  background-color: #02030a;
  background-image:
    radial-gradient(1px 1px at 8% 17%, #ffffffdd 45%, transparent 100%),
    radial-gradient(1.5px 1.5px at 21% 71%, #a9d5ffcc 45%, transparent 100%),
    radial-gradient(1px 1px at 38% 12%, #ffffffcc 45%, transparent 100%),
    radial-gradient(1.5px 1.5px at 79% 24%, #d8caffcc 45%, transparent 100%),
    radial-gradient(1px 1px at 91% 66%, #ffffffdd 45%, transparent 100%),
    radial-gradient(1px 1px at 67% 84%, #b8d8ffcc 45%, transparent 100%),
    radial-gradient(ellipse at 50% 40%, #17265b 0%, #090e29 43%, #030612 76%);
  background-size: 100% 100%;
  overflow: visible;
}
.cv.fallback::after {
  content: "";
  position: absolute;
  z-index: 0;
  width: 145%;
  height: 72%;
  left: -22%;
  top: 2%;
  border-radius: 50%;
  background:
    radial-gradient(ellipse at 50% 50%, transparent 0 24%, #9bbcff16 25%, transparent 28% 34%, #9d8bff22 35%, transparent 39%),
    conic-gradient(from 18deg at 50% 50%, transparent 0 18%, #85bfff22 23%, transparent 30% 53%, #a88bff20 60%, transparent 70% 100%);
  filter: blur(9px);
  transform: rotate(-17deg);
  animation: galaxyDrift 42s linear infinite;
}
.cv.fallback::before {
  content: "";
  position: absolute;
  z-index: 1;
  width: min(76vw, 430px);
  aspect-ratio: 1;
  left: 50%;
  top: 52%;
  border-radius: 50%;
  transform: translate(-50%, -50%);
  background:
    radial-gradient(ellipse at 31% 34%, #a5d58d 0 5%, transparent 5.8%),
    radial-gradient(ellipse at 61% 27%, #72b77e 0 7%, transparent 7.8%),
    radial-gradient(ellipse at 69% 54%, #9acb83 0 8%, transparent 8.8%),
    radial-gradient(ellipse at 40% 67%, #6da879 0 10%, transparent 10.8%),
    radial-gradient(ellipse at 51% 47%, #236f9a 0%, #145184 39%, #08284f 65%, #020817 76%);
  box-shadow: inset -35px -18px 55px #000c, inset 12px 8px 28px #a5e5ff55,
    0 0 32px #5abaff66, 0 0 90px #347dff66;
  animation: earthFloat 14s ease-in-out infinite alternate;
}
@keyframes galaxyDrift {
  from { transform: rotate(-17deg) scale(1); }
  to { transform: rotate(343deg) scale(1.08); }
}
@keyframes earthFloat {
  from { transform: translate(-50%, -50%) scale(.985); filter: brightness(.88); }
  to { transform: translate(-50%, -52%) scale(1.025); filter: brightness(1.12); }
}

</style></head><body>

<div id="loader" class="scr on"><div class="ld-t" id="ldT"></div><div class="ld-bar"><i id="ldbar"></i></div><div id="ldlog"></div><div class="cred" id="ldA"></div></div>
<div id="splash" class="scr"><div class="cv"></div><div class="shade"></div><canvas id="snow"></canvas><div class="in"><div class="kick">АВТОРСКАЯ КНИГА-ИГРА</div><h1 class="ttl" id="spT"></h1><div class="sub" id="spS"></div><div class="blurb" id="spB"></div><div class="cred" id="spF"></div><button id="spGo" class="big">НАЧАТЬ ИГРУ</button><button id="spCont" class="big" style="display:none;background:var(--pn);color:var(--tx);border:1px solid var(--ln)">ПРОДОЛЖИТЬ</button><div class="cred" id="spC"></div><div class="cred" id="spA"></div></div></div>
<div id="prologue" class="scr"><div class="in"><div class="kick">ПРОЛОГ</div><div id="pr"></div><button id="prGo" class="big pp">ВЫБРАТЬ ПУТЬ</button></div></div>
<div id="setup" class="scr">
 <h1>ВЫБОР ПУТИ</h1><div style="color:var(--dim)">Вы Лиор’Саэн, тихий спутник, чей свет ведёт Аэ́рхиса. Выберите путь Наблюдателя.</div><div class="cred" id="credA"></div><div class="cred" id="ucA"></div>
 <h2>Путь Наблюдателя</h2><div id="heroes"></div>
 <div id="cust" hidden><h2>Позывной</h2><input id="nm" maxlength="16" placeholder="Имя Наблюдателя">
  <h2>Навыки: ровно 4 из 10 (<span id="cnt">0</span>/4)</h2><div class="row" id="sk"></div></div>
 <h2>Темп</h2><div class="row"><button id="mReal" class="sel">Реалистичный</button><button id="mFast">Быстрый</button></div>
 <h2>Звук терминала</h2><div class="row"><button id="snd" class="sel">Звук: вкл</button></div>
 <button id="go" disabled>ВОЙТИ В КАНАЛ СВЕТА</button>
 <button id="cont" style="width:100%;margin-top:6px;display:none">Продолжить сохранённую игру</button>
</div>

<div id="game" class="scr">
 <div id="top">
  <div class="tl"><b id="hpt"></b><div class="bar"><i id="hpb" style="background:var(--ac)"></i></div><button id="bMode"></button><button id="bInv">🎒 <span id="ic"></span></button><button id="bLog">📓</button></div>
  <div class="tl"><b id="o2t"></b><div class="bar"><i id="o2b" style="background:var(--bl)"></i></div><b id="ent"></b><div class="bar"><i id="enb" style="background:var(--am)"></i></div><b id="am" style="min-width:56px"></b></div>
  <div class="pg" id="pg"></div>
 </div>
 <div class="cred" id="credG"></div><div id="chat"></div><div id="typ"></div>
 <div id="bot"><div id="wait" hidden></div><div id="chh" hidden></div><div id="chs"></div></div>
</div>
<div id="final" class="scr"><div id="fn"></div></div>
<div id="modal"><div id="mb"></div></div>

<script>
/* ============================================================
   STORY_DATA — сюда дописываете героев и сюжет.
   heroes[]  : { id, name, desc, skills:[4], items:[], ammo }
   meta      : start, customHero {items, ammo}, flagNames {флаг: подпись в Журнале}
   nodes[id] = {
     messages: [ "реплика" | { t:"реплика", skill:"Навык", item:"Предмет", flag:"флаг", noFlag:"флаг" } ],
        // объект показывается только если у героя есть навык / предмет / флаг. {hero} = позывной героя
     onEnter: { hp, o2, energy, ammo (числа ±), addItems:[], removeItems:[], addFlags:[], removeFlags:[] },
     waitSeconds, waitText,           // таймер после реплик
     choices: [{ text, goto, reqSkill, reqItem, reqAmmo, reqFlag, forbidFlag, hpCost, o2Cost, energyCost/enCost, hpGain, o2Gain, enGain }]
   }
   Нет choices — концовка. reqAmmo тратит патроны. Условия по флагам скрывают кнопку, прочие блокируют её.
   Гибель: HP или Кислород = 0.
   ============================================================ */

        { n: "Свет в трещинах Лиор’Саэна вспыхнул ярче, вычерчивая в мутной воде едва заметный контур вероятности: огромный металлический киль, рассекающий волны наверху, и спущенные за борт страховочные сети." },
        { sep: true },
        { n: "Когда тяжёлые, пахнущие мазутом и мокрой шерстью руки вытащили их на палубу траулера «Северный горизонт», мир вокруг взорвался звуками. Ветер срывал с гребней волн солёную пену, скрипели лебёдки, а вокруг сгрудились люди в прорезиненных оранжевых робах. Они кричали друг другу что-то на гортанном, резком языке, но в их голосах не было ни злобы, ни страха — только хриплая, суетливая тревога спасателей." },
        { from: "Капитан Брандт", t: "— Живой! Клянусь всеми святыми, он дышит! Хольгер, тащи термоодеяла! И позови Ингрид, живо!" },
        { from: "Матрос Клим", t: "— Капитан, гляньте на его голову... и на эту штуку рядом с ним! Это же не человек, Брандт! Что мы вытащили из воды?!" },
        { n: "Капитан Брандт на секунду замер. Его тяжёлый взгляд скользнул по серой, испещрённой мелкими кратерами коже на висках Аэ́рхиса, по бездонным чёрным глазам, а затем остановился на Лиор’Саэне, который бесшумно прижался к боку хозяина, притушив свет в своих трещинах до тусклого уголька." },
        { from: "Капитан Брандт", t: "— Мне плевать, откуда он свалился, сынок. В этом океане не бросают тех, кто ещё дышит. В лазарет его! Оба — в лазарет, живо!" }
      ],
      choices: [
        { text: "Попытаться настроиться на речь людей и ответить на их языке", reqSkill: "Язык", goto: "c01_02", addFlags: ["ПЕРВЫЙ_КОНТАКТ_СЛОВОМ"], enCost: 5 },
        { text: "Довериться интуиции Лиор’Саэна и сохранить спокойствие, не тратя силы", reqSkill: "Интуиция", goto: "c01_02", o2Gain: 5 },
        { text: "Сжать одеяло и позволить морякам отнести себя в тепло", goto: "c01_02", hpCost: 2 }
      ]
    },
    c01_02: {
      page: "Стр. 9–12",
      messages: [
        { n: "Судовой лазарет «Северного горизонта» оказался тесной каютой, пропахшей йодом, старым спиртом и влажным железом. За круглым иллюминатором, затянутым толстым слоем инея, продолжал реветь северный океан, но здесь, под гудение старых паровых труб, впервые за долгие часы стало по-настоящему тепло." },
        { n: "Аэ́рхиса уложили на узкую койку, пристёгнутую к переборке медными цепями. Рядом, на металлическом столике с высокими бортиками, неподвижно замер Лиор’Саэн — со стороны он казался причудливой чёрной статуэткой, обкатанной морскими волнами." },
        { n: "Дверь каюты распахнулась, впустив высокую женщину с туго затянутыми в узел светлыми волосами и усталыми серыми глазами. Она на ходу вытирала руки полотенцем, а следом за ней втиснулся невысокий коренастый парень в замасленном комбинезоне, с любопытством выглядывающий из-за её плеча." },
        { from: "Ингрид Вальк", t: "— Тео, я же просила не толпиться в дверях. Здесь и без тебя кислорода не хватает." },
        { from: "Тео", t: "— Да я только глянуть, доктор Вальк! Ребята на палубе божатся, что эта чёрная штука светилась под водой, как сварочная дуга. У меня в машинном отделении как раз генератор барахлит, может, пригодится..." },
        { from: "Ингрид Вальк", t: "— Убери руки от прибора, Тео, пока я не проверила его пульс." },
        { n: "Ингрид Вальк склонилась над койкой и на мгновение замерла, вглядываясь в необычное строение черепа Аэ́рхиса и его тёмные, почти лишённые белков глаза. В её взгляде не было суеверного ужаса — только острое, профессиональное удивление врача, столкнувшегося с тем, чего не было ни в одном учебнике." },
        { from: "Ингрид Вальк", t: "— Пульс сорок два удара в минуту. Температура тела ниже нормы на четыре градуса, но судорог нет. Вы понимаете меня? Если слышите и понимаете — кивните." },
        { n: "Лиор’Саэн на столике едва заметно шевельнулся. Тонкая голубая искра пробежала по его стеклянному боку, словно он оценивал обоих людей: открытое, живое любопытство механика Тео и спокойную, надёжную собранность доктора Ингрид." }
      ],
      choices: [
        { text: "Медленно кивнуть и тихо произнести на их языке: «Мы... не враги»", reqSkill: "Язык", goto: "c01_03", addFlags: ["ОТКРЫЛСЯ_ЛЮДЯМ"], enCost: 5 },
        { text: "Оценить медицинские приборы Ингрид и помочь ей понять, как лечить ваш организм", reqSkill: "Медицина", goto: "c01_03", hpGain: 3, addFlags: ["ДОВЕРИЕ_ВРАЧА"] },
        { text: "Проследить за взглядом механика Тео и заметить его интерес к технологиям", reqSkill: "Наблюдение", goto: "c01_03", addFlags: ["ИНТЕРЕС_ТЕО"] },
        { text: "Промолчать, изображая полное истощение, чтобы выиграть время и осмотреться", goto: "c01_03", addFlags: ["СКРЫЛ_ПРАВДУ"] }
      ]
    },
    c01_03: {
      page: "Стр. 13–16",
      messages: [
        { sep: true },
        { n: "Спустя два часа качка немного утихла, но «Северный горизонт» всё ещё тяжело взбирался на пологие ледяные валы. В лазарет заглянул боцман Хольгер — грузный мужчина с перебитым носом и добрыми, прищуренными глазами — и притащил дымящийся металлический чайник." },
        { from: "Хольгер", t: "— Кок Марта велела передать. Говорит, будь он хоть с Луны, а горячий бульон с имбирём любого на ноги поставит. Кстати, капитан Брандт просил зайти на мостик, как только наш гость сможет стоять на ногах. У радиста Свена приборы с ума сходят с тех пор, как мы их подняли." },
        { from: "Ингрид Вальк", t: "— Что там у Свена?" },
        { from: "Хольгер", t: "— Рация ловит какой-то странный фон на ультракоротких волнах. Будто кто-то с орбиты или со дна морского азбуку Морзе отстукивает. И компас на три градуса в сторону уводит." },
        { n: "Лиор’Саэн мгновенно отреагировал на эти слова. Его стеклянная поверхность потемнела, а трещины налились тревожным янтарным светом. Аэ́рхис сразу понял, о чём предупреждает спутник: обломки их разбитого корабля на дне океана всё ещё подавали аварийный маяк. Если сигнал перехватят береговые службы или чужие суда, спокойная жизнь на этом корабле закончится, не успев начаться." },
        { from: "Аэ́рхис", t: "— Нам нужно подняться на мостик. Если этот сигнал не заглушить или не сбить с курса, за нами придут. И тогда пострадают все, кто нас спас." }
      ],
      waitSeconds: 12,
      waitText: "Аэ́рхис и Лиор’Саэн поднимаются по узкому трапу на капитанский мостик",
      choices: [
        { text: "Предложить технику Тео помощь в настройке судовой рации, чтобы заглушить маяк", reqSkill: "Ремесло", goto: "c01_04", addFlags: ["ЗАГЛУШИЛ_МАЯК"], enCost: 10 },
        { text: "Попросить Лиор’Саэна накрыть корабль полем искажения вероятностей", reqSkill: "Интуиция", goto: "c01_04", addFlags: ["ПОЛЕ_ТИШИНЫ"], enCost: 15 },
        { text: "Честно рассказать капитану Брандту об угрозе со дна океана", reqSkill: "Эмпатия", goto: "c01_04", addFlags: ["СОЮЗ_С_КАПИТАНОМ"] },
        { text: "Подняться на мостик и сначала выслушать доклад радиста Свена", goto: "c01_04", o2Cost: 5 }
      ]
    },
    c01_04: {
      page: "Стр. 17–19",
      messages: [
        { n: "Мостик «Северного горизонта» был тесным, низким и удивительно тёплым. Стёкла дрожали в рамах, по потолку шли трубы отопления, а на центральном столе лежала карта северного моря, прижатая латунными грузиками. За окнами волны поднимались выше фальшборта, но капитан Брандт стоял у штурвала так неподвижно, словно шторм был не стихией, а старым собеседником, которого он давно научился не перебивать." },
        { from: "Капитан Брандт", t: "— Значит, вы уже можете ходить. Хорошо. Теперь объясните, почему мой радист слышит сигнал, от которого стрелка компаса уходит в сторону." },
        { n: "Свен сидел у приёмника, прижав один наушник к уху. На столе перед ним лежала лента с карандашными отметками: короткие импульсы, длинная пауза, снова короткие. Он поднял глаза на Аэ́рхиса, затем на Лиор’Саэна." },
        { from: "Свен", t: "— Я не знаю, кто передаёт. Но это не обычная помеха. Сигнал повторяется через равные промежутки, а каждый раз, когда эта... штука светится, на шкале появляется один и тот же провал." },
        { flag: "ЗАГЛУШИЛ_МАЯК", n: "После вашей совместной работы с Тео сигнал на приёмнике стал тише. Не исчез — лишь отступил, словно источник потерял точную настройку. Свен снял наушник и впервые за весь разговор улыбнулся: теперь у них было время разобраться, а не просто слушать чужой зов." },
        { flag: "ПОЛЕ_ТИШИНЫ", n: "Поле Лиор’Саэна обняло корпус невидимой рябью. На стекле приёмника проступили тонкие голубые линии, и шум резко просел. Свен посмотрел на шкалу, потом на вас: корабль словно выпал из чужого слуха, но удерживать поле долго было нельзя." },
        { flag: "СОЮЗ_С_КАПИТАНОМ", n: "Капитан выслушал предупреждение до конца, не перебив ни разу. Его лицо не стало мягче, но он убрал руку с кобуры сигнального пистолета и приказал Свену записывать всё, что покажет прибор. Между вами возникло не доверие, а первый рабочий союз — более надёжная вещь в штормовом море." },
        { noFlag: "ЗАГЛУШИЛ_МАЯК", n: "Сигнал продолжал повторяться. Он то тонул в шуме волн, то возвращался с такой отчётливостью, будто источник находился не на дне, а прямо за кормой. Вы понимали: скрыть его можно, но решить проблему — пока нет." },
        { from: "Капитан Брандт", t: "— Я не стану требовать от вас невозможного. Но пока этот сигнал ведёт кого-то к моему судну, решение должно быть общим. Что мы можем сделать сейчас?" },
        { sep: true },
        { n: "Аэ́рхис опёрся ладонью о край карты. Лицо его всё ещё оставалось бледным, однако взгляд уже не плыл. Вы ощутили, как он прислушивается не к словам людей, а к коротким паузам между импульсами: в них прятался повторяющийся рисунок, похожий на координатную метку." }
      ],
      choices: [
        { text: "Сопоставить ритм сигнала с движением судна и определить направление", reqSkill: "Наблюдение", goto: "c01_05", addFlags: ["СВЕН_СОХРАНИЛ_СИГНАЛ"] },
        { text: "Восстановить последовательность импульсов по памяти корабельных кодов", reqSkill: "Память", goto: "c01_05", addFlags: ["РАСШИФРОВАЛ_ИМПУЛЬС"] },
        { text: "Попросить капитана изменить курс, пока источник не определён", reqSkill: "Интуиция", goto: "c01_05", addFlags: ["БРАНДТ_ИЗМЕНИЛ_КУРС"] },
        { text: "Объяснить Свену, как отличить маяк от случайного шума", reqSkill: "Язык", reqAmmo: 1, goto: "c01_05", addFlags: ["СВЕН_СОХРАНИЛ_СИГНАЛ"] }
      ]
    },
    c01_05: {
      page: "Стр. 20–22",
      messages: [
        { n: "Когда разговор на мостике закончился, Хольгер проводил Аэ́рхиса по узкому коридору в камбуз. Здесь воздух был густым от пара, хлебной корки, рыбного бульона и сушёных трав. На плите покачивалась тяжёлая кастрюля, а за круглым окном то и дело возникала белая стена пены. Кок Марта, невысокая женщина с сильными руками и быстрыми движениями, распоряжалась всем помещением так, словно шторм был всего лишь лишним поварёнком, которому следовало не мешать." },
        { from: "Марта", t: "— Садись. Не спорь. У меня правило: кто попал на мой корабль живым, тот сначала ест, потом рассказывает, откуда взялся." },
        { from: "Аэ́рхис", t: "— Я не уверен, что смогу..." },
        { from: "Марта", t: "— Сможешь. Бульон жидкий, ложка маленькая. А если не сможешь — я всё равно оставлю кружку рядом." },
        { n: "Хольгер поставил у стены сушиться мокрые рукавицы и негромко рассмеялся. В его смехе не было насмешки: скорее облегчение человека, который слишком часто видел, как море забирает тех, кому ещё можно было помочь. Тео появился следом, держа в руках аккуратно свёрнутую полоску кожи и две латунные скобы." },
        { from: "Тео", t: "— Я подумал, что для Лиор’Саэна можно сделать крепление. Чтобы не катался по столу и не бился о переборки. Только если он сам не против." },
        { flag: "ИНТЕРЕС_ТЕО", n: "Тео поглядывал на вас с тем же любопытством, с каким механик смотрит на незнакомый двигатель. Но он не пытался разобрать тайну силой. Он ждал разрешения — и это было важнее любой его догадки." },
        { flag: "ДОВЕРИЕ_ВРАЧА", n: "Ингрид заглянула в камбуз проверить, не вернулась ли у Аэ́рхиса дрожь. Увидев, что он держит ложку самостоятельно, она едва заметно кивнула. Её записи о вашем свете уже перестали быть перечнем симптомов: теперь в них появились вопросы о связи между вами." },
        { n: "За столом впервые собрались почти все: Марта разливала бульон, Хольгер рассказывал о старом шторме у северных скал, Тео спорил со Свеном о том, может ли помеха иметь собственный ритм. Аэ́рхис слушал их, не всегда понимая слова, но постепенно различая голоса и характеры." },
        { sep: true },
        { from: "Марта", t: "— Тут не любят чужих тайн, но ещё меньше любят, когда кто-то умирает от холода у них на глазах. Так что ешь. Разговоры подождут." }
      ],
      onEnter: { addItems: ["Целебный отвар"] },
      choices: [
        { text: "Принять заботу Марты и позволить ей помочь восстановить силы", reqSkill: "Эмпатия", goto: "c01_06", hpGain: 2, addFlags: ["ДОВЕРИЕ_МАРТЫ"] },
        { text: "Поблагодарить Хольгера и расспросить о маршруте судна", reqSkill: "Навигация", goto: "c01_06", addFlags: ["ХОЛЬГЕР_ПОМОГАЕТ"] },
        { text: "Разрешить Тео изготовить крепление для Лиор’Саэна", reqSkill: "Ремесло", goto: "c01_06", addFlags: ["ТЕО_ДОВЕРЯЕТ"] },
        { text: "Оценить свои силы, тепло и запас воздуха после спасения", reqSkill: "Выживание", goto: "c01_06", addFlags: ["ИЗУЧИЛ_КОМАНДУ"] }
      ]
    },
    c01_06: {
      page: "Стр. 23–25",
      messages: [
        { n: "После еды Тео попросил разрешения отнести вас в радиорубку. Он не хотел оставлять Аэ́рхиса одного надолго, поэтому Ингрид настояла, чтобы дверь оставалась открытой, а сам больной сидел в соседнем кресле. Радиорубка была тесной, заставленной катушками, приборами и коробками с запасными лампами. Здесь пахло горячей пылью и озоном — запах напомнил Аэ́рхису о корабле, которого больше не было." },
        { from: "Свен", t: "— Вот запись. Слушайте внимательно. Три коротких, один длинный, пауза. Потом повтор. Но в последней серии появился ещё один удар — очень слабый." },
        { n: "Свен включил приёмник. Из динамика потянулся шорох, похожий на дождь по металлической крыше. Между треском проступили импульсы. Ваш свет отозвался на них сразу: трещины вспыхнули серебристо-голубым, а затем одна тонкая линия на корпусе замерла, словно прислушивалась." },
        { flag: "РАСШИФРОВАЛ_ИМПУЛЬС", n: "Сохранённая последовательность сложилась в знакомую форму. Это был не зов о помощи и не случайный маяк — скорее отметка присутствия, короткое сообщение, оставленное тому, кто сумеет его распознать." },
        { flag: "СВЕН_СОХРАНИЛ_СИГНАЛ", n: "Свен бережно подписал катушку и убрал её в отдельный футляр. Он больше не называл сигнал помехой. Теперь для него это была запись, которую нельзя потерять." },
        { from: "Тео", t: "— Если я подключу к приёмнику запасной контур, можно будет поймать следующий импульс чище. Но генератор и так еле держится." },
        { from: "Ингрид Вальк", t: "— А если перегрузишь линию, весь корабль останется без связи. Сначала подумай, потом крути провода." },
        { n: "Аэ́рхис посмотрел на вас. Он уже мог стоять, говорить короткими фразами и держать кружку без дрожи, но усталость возвращалась волнами. Впервые после падения у вас появилась возможность не только спасать его, но и исследовать то, что привело вас к Земле." },
        { sep: true },

/* --- счётчик глав и страниц: читает page из текущего узла STORY_DATA --- */
function pgInfo() {
  const M = STORY_DATA.meta, n = STORY_DATA.nodes[st.node] || {}, C = M.chapters;
  const pgNum = v => { const m = String(v == null ? "" : v).match(/\d+/); return m ? Number(m[0]) : 0; };
  const rg = c => String(c.pages).split(/[–-]/).map(Number), has = (c, pg) => { const [a, b] = rg(c); return pg >= a && pg <= (b || a); };
  const page = pgNum(n.page) || pgNum(st.page) || (C[0] ? rg(C[0])[0] : 0);
  let c = n.chapter ? C.find(x => x.no === n.chapter.no) : null;
  if (!c) c = C.find(x => x.no === st.chap && has(x, page));
  if (!c) c = C.find(x => has(x, page));
  if (!c) c = C.find(x => x.no === st.chap);
  return { page, c, total: M.totalPages };
}

function snow() {

  const p = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * .25 + .05, ph: Math.random() * 6.3, sp: Math.random() * .03 + .01, col: Math.random() < .3 ? "214,184,255" : "143,184,255" }));
  (function f() { if (!$("#splash").classList.contains("on")) return; x.clearRect(0, 0, W, H);
    p.forEach(q => { q.ph += q.sp; q.y -= q.v; q.x += Math.sin(q.ph) * .15; if (q.y < -4) { q.y = H + 4; q.x = Math.random() * W; }
      const a = .25 + .75 * Math.abs(Math.sin(q.ph * 1.7)); x.fillStyle = "rgba(" + q.col + "," + a.toFixed(2) + ")"; x.shadowColor = "rgba(" + q.col + ",.9)"; x.shadowBlur = q.r * 5;
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.3); x.fill(); }); requestAnimationFrame(f); })();
}
function boot() {
  const L = STORY_DATA.meta.bootLines; let i = 0;
  const t = setInterval(() => { $("#ldlog").textContent = L[i] || ""; $("#ldbar").style.width = Math.min(100, (i + 1) / L.length * 100) + "%"; i++; if (i > L.length) { clearInterval(t); show("splash"); snow(); } }, 650);
}
function prologue() {
  show("prologue"); const b = $("#pr"); b.innerHTML = "";
  M.prologue.forEach(t => {
    const p = document.createElement("p");
    p.className = "pp"; p.style.animation = "none"; p.style.opacity = "1";
    p.textContent = t; b.append(p);
  });
  const go = $("#prGo"); go.style.animation = "none"; go.style.opacity = "1"; go.style.animationDelay = "0s";
  $("#prologue .in").scrollTop = 0;
}
$("#spGo").onclick = () => { sfx.click(); prologue(); };
$("#spCont").onclick = () => $("#cont").onclick();
$("#prGo").onclick = () => { sfx.click(); show("setup"); };
refresh(); drawSetup(); boot();
</script></body></html>
