<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>НАБЛЮДАТЕЛИ АНДРОМЕДЫ — книга-игра</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;700&family=Lora:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet"><style>
:root{--bg:#05060e;--pn:#0c0f1d;--ln:#1c2140;--tx:#dbe4ff;--dim:#7b86b5;--ac:#8fb8ff;--rd:#ff6b8b;--am:#c9a8ff;--bl:#6ee7ff}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--tx);font:15px/1.45 ui-monospace,Menlo,Consolas,monospace;width:min(100vw,calc(100dvh*9/16));margin:0 auto;display:flex;flex-direction:column}
.scr{display:none;flex:1;min-height:0;flex-direction:column}.scr.on{display:flex}
button{font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px 12px;cursor:pointer;text-align:left}
button:active{background:#16222e}button:disabled{opacity:.4;cursor:not-allowed}button.sel{border-color:var(--ac);color:var(--ac)}
#setup{padding:16px;overflow:auto;gap:8px}h1{font-size:20px;color:var(--ac);margin:0}h2{font-size:13px;color:var(--dim);text-transform:uppercase;margin:14px 0 4px}
.hero{display:block;width:100%;margin-bottom:6px}.hero small{display:block;color:var(--dim);font-size:12px;margin-top:2px}.hero.sel small{color:var(--tx)}
.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 auto;text-align:center}
input{width:100%;font:inherit;color:var(--tx);background:var(--pn);border:1px solid var(--ln);border-radius:8px;padding:10px}
#go{width:100%;margin-top:14px;background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center}
#top{padding:calc(8px + env(safe-area-inset-top,0px)) 10px 8px;background:var(--pn);border-bottom:1px solid var(--ln)}
.tl{display:flex;gap:6px;align-items:center;font-size:12px;color:var(--dim)}.tl+.tl{margin-top:6px}
.bar{flex:1;height:9px;background:#1a2530;border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;transition:width .4s}
.tl b{min-width:70px;color:var(--tx);font-weight:400}.tl button{padding:5px 9px;font-size:13px}
#chat{flex:1;overflow:auto;padding:12px 10px;display:flex;flex-direction:column;gap:8px}
.m{max-width:82%;padding:8px 11px;border-radius:12px;white-space:pre-wrap;animation:f .25s}@keyframes f{from{opacity:0;transform:translateY(6px)}}
.m.in{background:var(--pn);border:1px solid var(--ln);align-self:flex-start;border-bottom-left-radius:3px}.m.in b{display:block;font-size:11px;color:var(--ac)}
.m.out{background:#27306b;align-self:flex-end;border-bottom-right-radius:3px}
.m.sys{align-self:center;max-width:95%;font-size:12px;color:var(--am);text-align:center;padding:0}.m.sys.bad{color:var(--rd)}
#typ{color:var(--dim);font-size:12px;padding:0 12px 4px;height:20px}
#bot{padding:8px 10px calc(10px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--ln);background:var(--pn);display:flex;flex-direction:column;gap:6px;min-height:64px}
#wait{text-align:center;color:var(--am);padding:12px 0}.ch small{color:var(--dim)}
#modal{position:fixed;inset:0;background:#000c;display:none;align-items:center;justify-content:center;padding:16px;z-index:9}#modal.on{display:flex}
#mb{background:var(--pn);border:1px solid var(--ln);border-radius:12px;padding:14px;width:100%;max-width:460px;max-height:80vh;overflow:auto;display:flex;flex-direction:column;gap:8px}
#mb h3{margin:0;color:var(--ac);font-size:15px}#mb p{margin:0;color:var(--dim)}#mb.dead h3{color:var(--rd);font-size:18px}
/* Интерактивное оглавление журнала */
.toc{display:flex;flex-direction:column;gap:5px;max-height:42vh;overflow:auto;padding-right:3px}
.toc-item{display:flex;align-items:center;gap:9px;width:100%;padding:9px 10px;border:1px solid var(--ln);background:#090d19;text-align:left}
.toc-item .toc-mark{flex:0 0 23px;text-align:center;font-size:16px;color:var(--dim)}
.toc-item .toc-main{display:flex;flex-direction:column;gap:2px;min-width:0;flex:1}
.toc-item .toc-name{color:var(--tx);font-size:13px;font-weight:700}
.toc-item .toc-pages{color:var(--dim);font-size:11px}
.toc-item.done{border-color:#31534a}.toc-item.done .toc-mark{color:#83d6a5}
.toc-item.current{border-color:var(--ac);background:#17213a;box-shadow:inset 3px 0 var(--ac)}.toc-item.current .toc-mark,.toc-item.current .toc-name{color:var(--ac)}
.toc-item.locked{opacity:.52;cursor:not-allowed}
.toc-summary{padding:7px 10px 9px 42px;color:#aebbdc;font:italic 12px/1.5 Lora,Georgia,serif;border-left:1px solid var(--ln);margin:0 0 3px 11px}
.toc-legend{font-size:11px;color:var(--dim);line-height:1.7}

#loader,#splash,#prologue{align-items:center;justify-content:center;text-align:center;padding:24px;position:relative;overflow:hidden}
.ld-t{font:700 22px Oswald,Impact,sans-serif;letter-spacing:.35em;color:var(--ac);animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.45}}
.ld-bar{width:70%;height:4px;background:#1a2530;border-radius:2px;overflow:hidden;margin:20px auto 10px}
.ld-bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#8fb8ff,#d6b8ff);transition:width .5s}
#ldlog{color:var(--dim);font-size:12px;height:18px}
.cred{color:var(--dim);font-size:11px;letter-spacing:.08em;text-align:center;padding:4px 8px}
#snow{position:absolute;inset:0;width:100%;height:100%}
.in{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:14px;width:100%}
.kick{font:500 12px Oswald,sans-serif;letter-spacing:.5em;color:var(--am)}
.ttl{font:700 clamp(34px,11.5vw,72px)/1 Oswald,Impact,sans-serif;letter-spacing:.06em;margin:0;background:linear-gradient(180deg,#ffffff,#b9c8ff 50%,#7a5cff);-webkit-background-clip:text;background-clip:text;color:transparent;animation:rise 1.8s ease-out both,glow 4s ease-in-out 1.8s infinite}
@keyframes rise{from{opacity:0;transform:translateY(24px) scale(.96);letter-spacing:.35em}}@keyframes glow{50%{filter:drop-shadow(0 0 16px #8fb8ffaa)}}
.sub{font:italic 17px Lora,Georgia,serif;color:#9fb6c6;animation:fi 2s 1s both}@keyframes fi{from{opacity:0}}
button.big{background:var(--ac);color:#07102a;font-weight:700;border:0;text-align:center;width:100%;max-width:320px;letter-spacing:.1em;animation:fi 2s 1.6s both}
#pr{max-width:440px}.pp{font:italic 17px/1.7 Lora,Georgia,serif;color:#c3d6e2;opacity:0;animation:fi 1.4s forwards;margin:0 0 14px}
#prGo.pp{font:700 15px Oswald,sans-serif;font-style:normal;color:#07102a}
/* --- книжная вёрстка: абзацы, прямая речь, разделитель сцен --- */
.m.nar,.m.spk{align-self:stretch;max-width:100%;background:none;border:0;border-radius:0;padding:0 2px;font:400 16px/1.75 Lora,Georgia,serif;color:#c3d0ee;text-align:justify;text-indent:1.6em;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:anywhere}
.m.spk{color:#e8eeff}.m.spk .dash{color:var(--am);font-weight:600}
.m.nar+.m.nar,.m.nar+.m.spk,.m.spk+.m.nar,.m.spk+.m.spk{margin-top:-5px}
.m.hd+.m.nar,.m.hd+.m.spk,.m.sep+.m.nar,.m.sep+.m.spk{text-indent:0}
#final{padding:16px;overflow:auto}#fn{display:flex;flex-direction:column;gap:6px}
#fn h3{font:600 13px Oswald,sans-serif;letter-spacing:.2em;color:var(--dim);text-transform:uppercase;margin:14px 0 2px}
.fh{font:700 30px/1.15 Oswald,Impact,sans-serif;color:var(--ac);margin:0}.fh.bad{color:var(--rd)}.fs{color:var(--am);font-size:13px}
.fe{font:italic 16px/1.7 Lora,Georgia,serif;color:#c3d6e2;margin:8px 0}
.card{background:var(--pn);border:1px solid var(--ln);border-radius:10px;padding:8px 12px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:4px 0;border-bottom:1px dashed var(--ln)}.kv:last-child{border:0}.kv b{font-weight:400;text-align:right}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips span{border:1px solid var(--ln);border-radius:14px;padding:3px 10px;font-size:12px;color:var(--dim)}
#chs{display:flex;flex-direction:column;gap:6px;overflow-y:auto;overscroll-behavior:contain;scroll-snap-type:y proximity;scrollbar-width:thin;scrollbar-color:var(--ac) transparent}
#chs::-webkit-scrollbar{width:6px}#chs::-webkit-scrollbar-thumb{background:var(--ac);border-radius:3px}
#chs button{flex:0 0 auto;scroll-snap-align:start;padding:8px 10px;font-size:14px;line-height:1.35}
#chs button.more{text-align:center;background:var(--ac);color:#07102a;font-weight:700;letter-spacing:.04em;border:0}
#chh{font-size:11px;color:var(--am);text-align:center;letter-spacing:.05em}
html{background:#02030a}body{height:100dvh;overflow:hidden}
@media (min-aspect-ratio:3/4){body{border-left:1px solid var(--ln);border-right:1px solid var(--ln)}}
#splash,#prologue{overflow-y:auto}.blurb{font:italic 14px/1.55 Lora,Georgia,serif;color:#b8c4ea;max-width:400px;animation:fi 2s 1.2s both}
.m.hd{align-self:stretch;max-width:100%;text-align:center;padding:18px 0 8px;animation:fi 1s}.m.hd small{display:block;letter-spacing:.3em;color:var(--am);font-size:11px}
.m.hd h4{font:700 26px/1.15 Oswald,Impact,sans-serif;margin:6px 0 0;color:var(--tx);letter-spacing:.08em;text-transform:uppercase}
/* --- обложка, страницы, разделители --- */
#splash{overflow:hidden;justify-content:flex-end;padding:0;text-align:center}
.cv{position:absolute;inset:-5%;background:#02030a url(cover.png) center 22%/cover no-repeat;animation:breathe 24s ease-in-out infinite alternate;will-change:transform}
@keyframes breathe{from{transform:scale(1) translate3d(0,0,0)}to{transform:scale(1.13) translate3d(-1.5%,-2%,0)}}
.shade{position:absolute;inset:0;pointer-events:none;background:linear-gradient(to top,#02030a 0%,#02030af2 34%,#02030ab3 56%,#02030a40 74%,transparent 90%),radial-gradient(ellipse at 50% 18%,#2a6dff22,transparent 60%)}
#snow{pointer-events:none}
#splash .in{max-height:100%;overflow-y:auto;padding:24px 20px calc(22px + env(safe-area-inset-bottom,0px));gap:12px;scrollbar-width:none}
#splash .in::-webkit-scrollbar{display:none}
.ttl{font-size:clamp(28px,9vw,56px);line-height:1.08;filter:drop-shadow(0 0 10px #4da3ff99)}
@keyframes glow{50%{filter:drop-shadow(0 0 20px #5aaaffee) drop-shadow(0 0 44px #2a6dffaa)}}
#splash .blurb{color:#d3dcff;text-shadow:0 1px 6px #000}
#splash .cred,#splash .sub,#splash .kick{text-shadow:0 1px 5px #000}
.pg{margin-top:6px;text-align:center;font-size:12px;letter-spacing:.14em;color:var(--am)}
.pg:empty{display:none}.pg::after{content:"";display:block;height:2px;margin-top:5px;border-radius:1px;background:linear-gradient(90deg,var(--am) var(--p,0%),var(--ln) 0)}
.m.sep{align-self:stretch;max-width:100%;text-align:center;color:var(--dim);font:400 22px/1 Lora,Georgia,serif;letter-spacing:.45em;text-indent:.45em;padding:16px 0 12px;opacity:.9}

/* --- Мобильная компоновка: фиксированные панели, прокрутка только текста --- */
html, body { height: 100%; min-height: 0; }
body {
  height: 100dvh; max-height: 100dvh; overflow: hidden;
  display: flex; flex-direction: column;
}
#game {
  width: 100%; height: 100%; max-height: 100dvh; min-height: 0;
  flex: 1 1 0; overflow: hidden; display: flex; flex-direction: column;
}
#game > #top, #game > #credG, #game > #typ, #game > #bot {
  flex: 0 0 auto; min-height: 0;
}
#game > #chat {
  flex: 1 1 0; min-height: 0; max-height: none;
  overflow-x: hidden; overflow-y: auto; overscroll-behavior: contain;
  -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
}
#game > #bot { flex-shrink: 0; overflow: visible; }
#game #chs {
  max-height: none !important; overflow: visible; overscroll-behavior: auto;
  scroll-snap-type: none; scrollbar-width: none;
}
#game #chs::-webkit-scrollbar { display: none; }
#game #chs button { flex: 0 0 auto; }

/* --- Пролог появляется полностью сразу; длинный текст прокручивается внутри --- */
#prologue .in {
  width: 100%; max-height: 100%; min-height: 0;
  overflow-x: hidden; overflow-y: auto; align-items: stretch;
  justify-content: flex-start;
  padding: 12px 16px calc(18px + env(safe-area-inset-bottom, 0px));
  scrollbar-width: thin;
}
#prologue .kick { text-align: center; }
#prologue #pr { width: 100%; max-width: 520px; margin: 0 auto; }
#prologue .pp { opacity: 1; animation: none; }
#prologue #pr .pp {
  font: italic 16px/1.75 Lora, Georgia, serif; color: #c3d6e2;
  text-align: justify; text-indent: 1.4em; margin: 0 0 14px;
}
#prologue #prGo {
  opacity: 1; animation: none; align-self: center; margin: 10px auto 0;
}

</style></head><body>

<div id="loader" class="scr on"><div class="ld-t" id="ldT"></div><div class="ld-bar"><i id="ldbar"></i></div><div id="ldlog"></div><div class="cred" id="ldA"></div></div>
<div id="splash" class="scr"><div class="cv"></div><div class="shade"></div><canvas id="snow"></canvas><div class="in"><div class="kick">АВТОРСКАЯ КНИГА-ИГРА</div><h1 class="ttl" id="spT"></h1><div class="sub" id="spS"></div><div class="blurb" id="spB"></div><div class="cred" id="spF"></div><button id="spGo" class="big">НАЧАТЬ ИГРУ</button><button id="spCont" class="big" style="display:none;background:var(--pn);color:var(--tx);border:1px solid var(--ln)">ПРОДОЛЖИТЬ</button><div class="cred" id="spC"></div><div class="cred" id="spA"></div></div></div>

<div id="setup" class="scr">
 <h1>ВЫБОР ПУТИ</h1><div style="color:var(--dim)">Вы Лиор’Саэн, тихий спутник, чей свет ведёт Аэ́рхиса. Выберите путь Наблюдателя.</div><div class="cred" id="credA"></div><div class="cred" id="ucA"></div>
 <h2>Путь Наблюдателя</h2><div id="heroes"></div>
 <div id="cust" hidden><h2>Позывной</h2><input id="nm" maxlength="16" placeholder="Имя Наблюдателя">
  <h2>Навыки: ровно 4 из 10 (<span id="cnt">0</span>/4)</h2><div class="row" id="sk"></div></div>
 <h2>Темп</h2><div class="row"><button id="mReal" class="sel">Реалистичный</button><button id="mFast">Быстрый</button></div>
 <h2>Звук терминала</h2><div class="row"><button id="snd" class="sel">Звук: вкл</button></div>
 <button id="go" disabled>ВОЙТИ В КАНАЛ СВЕТА</button>
 <button id="cont" style="width:100%;margin-top:6px;display:none">Продолжить сохранённую игру</button>
</div>

<div id="game" class="scr">
 <div id="top">
  <div class="tl"><b id="hpt"></b><div class="bar"><i id="hpb" style="background:var(--ac)"></i></div><button id="bMode"></button><button id="bInv">🎒 <span id="ic"></span></button><button id="bLog">📓</button></div>
  <div class="tl"><b id="o2t"></b><div class="bar"><i id="o2b" style="background:var(--bl)"></i></div><b id="ent"></b><div class="bar"><i id="enb" style="background:var(--am)"></i></div><b id="am" style="min-width:56px"></b></div>
  <div class="pg" id="pg"></div>
 </div>
 <div class="cred" id="credG"></div><div id="chat"></div><div id="typ"></div>
 <div id="bot"><div id="wait" hidden></div><div id="chh" hidden></div><div id="chs"></div></div>
</div>
<div id="final" class="scr"><div id="fn"></div></div>
<div id="modal"><div id="mb"></div></div>

<script>
/* ============================================================
   STORY_DATA — сюда дописываете героев и сюжет.
   heroes[]  : { id, name, desc, skills:[4], items:[], ammo }
   meta      : start, customHero {items, ammo}, flagNames {флаг: подпись в Журнале}
   nodes[id] = {
     messages: [ "реплика" | { t:"реплика", skill:"Навык", item:"Предмет", flag:"флаг", noFlag:"флаг" } ],
        // объект показывается только если у героя есть навык / предмет / флаг. {hero} = позывной героя
     onEnter: { hp, o2, energy, ammo (числа ±), addItems:[], removeItems:[], addFlags:[], removeFlags:[] },
     waitSeconds, waitText,           // таймер после реплик
     choices: [{ text, goto, reqSkill, reqItem, reqAmmo, reqFlag, forbidFlag, hpCost, o2Cost, energyCost }]
   }
   Нет choices — концовка. reqAmmo тратит патроны. Условия по флагам скрывают кнопку, прочие блокируют её.
   Гибель: HP или Кислород = 0.
   ============================================================ */
const STORY_DATA = {
  /* Схема узла: messages [строка | {n:"абзац рассказчика"} | {t, skill, item, flag, noFlag}], onEnter {hp,o2,energy,ammo,addItems,removeItems,addFlags,removeFlags},
     drain {energy,o2}, waitSeconds+waitText, isEnding+endingTitle+epilogue, choices [{text,goto,reqSkill,reqItem,useItem,reqAmmo,reqFlag,forbidFlag,hpCost,o2Cost,energyCost,addItems,addFlags}].
     Ресурсы в этой книге: hp = Жизненная сила, o2 = Ясность, energy = Свет Лиор’Саэна, ammo = Слова. */
  meta: {
    title: "НАБЛЮДАТЕЛИ АНДРОМЕДЫ", sub: "Книга-игра о тех, кто решил остаться",
    blurb: "Океан был холодным, мокрым и совершенно равнодушным. Корабль, которому полагалось лишь посмотреть на Землю издали, рухнул в него на скорости, о которой лучше не думать. Уцелели двое: Наблюдатель Аэ́рхис, умный, упрямый и сильно недооценивший планету, и вы, Лиор’Саэн, молчаливый стеклянный спутник со светом в трещинах. Рук у вас нет. Голоса нет. Зато есть дар видеть, куда ведут нити судьбы, и привычка светить там, где другие уже сдались. Люди, которых вы собирались изучать, вытащили вас из воды раньше, чем успели задать вопросы. Вопросы придут позже. Неудобные.",
    facts: "Авторская книга-игра · 19 глав и эпилог · стр. 5–377 (в работе)",
    totalPages: 377,
    chapters: [
      { no: 1, title: "Падение", pages: "5–28", ready: true, sum: "Гибель корабля, ледяной океан и первые руки людей." },
      { no: 2, title: "Люди из океана", pages: "28–47", ready: false, sum: "Палуба «Морской ласточки», капитан Ольсен, первые слова." },
      { no: 3, title: "Язык солёных ветров", pages: "47–60", ready: false, sum: "Учёба у Брюна, Тео и Ингрид; шторм и спасение матроса." },
      { no: 4, title: "Серый кит", pages: "60–73", ready: false, sum: "Порт, таверна Нины, маленькая Мири." },
      { no: 5, title: "Слепое пятно", pages: "73–90", ready: false, sum: "Инспектор Оскар замечает странный свет." },
      { no: 6, title: "Что видит свет", pages: "90–113", ready: false, sum: "Свет Лиор’Саэна растёт, Ингрид ищет объяснение." },
      { no: 7, title: "Ночь над гаванью", pages: "113–138", ready: false, sum: "Буря, затмение огней, первый страх города." },
      { no: 8, title: "Чужие среди своих", pages: "138–156", ready: false, sum: "Слухи, донос Лукаса, трещина в доверии." },
      { no: 9, title: "Огонь на складах", pages: "156–176", ready: false, sum: "Пожар в порту и цена спасения." },
      { no: 10, title: "Тишина после огня", pages: "176–188", ready: false, sum: "Разговор с Ольсен, правда выходит наружу." },
      { no: 11, title: "Те, кто ищет", pages: "188–213", ready: false, sum: "Бюро аномалий и агент Роуэн Кейн." },
      { no: 12, title: "Побег из порта", pages: "213–226", ready: false, sum: "Ночь погони, уход из города." },
      { no: 13, title: "Горный перевал", pages: "226–240", ready: false, sum: "Снег, голод, Лиор’Саэн слабеет." },

    prologue: [
      "Я родился в галактике Андромеды, среди холодного света далёких звёзд, где тьма не пугает, а учит слушать. С самого начала во мне жила мечта: увидеть Землю не через архивы, а своими глазами.",

      "Но Вселенная не уважает даже самые точные планы. Наш корабль потерпел крушение на орбите Земли, и мы рухнули в бездну океана, где, по всем прогнозам, всё должно было закончиться.",
      "Вы Лиор’Саэн. Вы не можете взять Аэ́рхиса за руку, но можете светить, подсказывать и удерживать его на границе сознания. Каждое ваше слово станет его выбором.",

    endings: {
      end_01: { title: "Часть жизни", epilogue: "Аэ́рхис и Лиор’Саэн остались на Земле не как гости и не как свидетели, а как часть живого мира. Люди приняли их так, будто они всегда были здесь. Иногда по вечерам, когда над портом загораются окна, вам обоим кажется, что это и есть дом." },
      end_02: { title: "Тихие среди людей", epilogue: "Никто не узнал, откуда они пришли. Аэ́рхис работал в порту, а Лиор’Саэн оставался странной тенью света на его плече. Правда сохранилась только в вашей памяти, и вы оба решили, что этого достаточно." },
      end_03: { title: "Зов Андромеды", epilogue: "Маяк вспыхнул, и среди звёзд ответил далёкий корабль. Аэ́рхис долго смотрел на землю с орбиты, пока облака не стали совсем маленькими. Вы знали, что часть вас навсегда осталась там, внизу, среди живого света." },
      end_04: { title: "Новая история", epilogue: "Аэ́рхис написал всё, что с ними случилось: океан, моряков, первый рассвет над Землёй. Эту рукопись назвали сказкой, но кто-то в ней узнал правду. И пока её читают, история Вел’Ноктари не заканчивается." },
      end_05: { title: "Тишина океана", epilogue: "Океан хранит свои тайны. Где-то в глубине ещё мерцает слабый свет, но никто не придёт его искать." },
      end_06: { title: "Мост между мирами", epilogue: "Над портом, где когда-то упал чужой свет, теперь горит маяк, видимый и людям, и звёздам. Страж Ири’Тан оставил на Земле тропу, по которой однажды придут другие: не захватчики и не наблюдатели, а гости. Аэ́рхис и Лиор’Саэн стоят на причале и знают, что их история только начинается." }

  nodes: {
    c01_01: {
      page: "Стр. 5–7",
      chapter: { no: 1, title: "Падение", pages: "5–28" },
      messages: [
        { n: "Наблюдатели Вел’Ноктари не называли планеты красивыми. Красота, говорили наставники, — слово тех, кто уже успел привязаться. Мы употребляли другие: пригодная для жизни, нестабильная, населённая, опасная. Земля стояла в архиве между двумя отметками — «океаническая биосфера» и «нежелательное вмешательство». Аэ́рхис перечитывал эту строку трижды, пока корабль «Эхо» проходил последнюю дугу над голубым полушарием. Он не доверял сухим отчётам. Ему хотелось увидеть мир, который дышал под облаками, услышать его шум, почувствовать, как пахнет воздух там, где ещё не ступала его нога." },
        { n: "Вы, Лиор’Саэн, сопровождали его с начала пути. Ваша оболочка была создана не для полёта и не для боя: тёмное стекло, тонкая сеть трещин, внутри которых пульсировал ровный холодный свет. Вы хранили его наблюдения, поддерживали связь с памятью корабля и замечали перемены прежде, чем они становились событиями. Сейчас свет в ваших трещинах шёл медленнее обычного. Земля притягивала не только корпус — она тянула к себе внимание, словно давно ждала, когда кто-нибудь наконец посмотрит на неё без приборов." },
        { from: "Аэ́рхис", t: "— Смотри, Лиор. Там целые материки. И облака движутся не по расчёту, а как будто спорят друг с другом." },
        { n: "На обзорном стекле скользнула синяя тень океана. Впервые за несколько месяцев Аэ́рхис улыбнулся не из вежливости и не потому, что так требовал протокол. Он снял перчатку и коснулся стекла ладонью, будто между ним и планетой уже не было вакуума. Вы почувствовали тепло его руки через контактный канал. Это было странно: Земля находилась за тысячами километров, но в глубине вашего корпуса отозвалась мягкая, почти человеческая дрожь." },
        "— Я хотел бы задержаться здесь дольше, чем разрешает маршрут.",
        { sep: true },
        { n: "Сначала тревога пришла не звуком, а пустотой. На секунду исчез гул вентиляции, затем погасла половина навигационных меток. Под ногами дрогнула палуба. За обзорным стеклом тонкая голубая линия атмосферы вдруг вспыхнула белым, и весь корабль словно зацепился за невидимый крюк." },
        { from: "Эхо-7", t: "— Внимание. Потеряна синхронизация стабилизаторов. Автоматическая коррекция не отвечает. До входа в плотные слои — сорок одна секунда." },
        { from: "Аэ́рхис", t: "— Эхо, повтори. Это ошибка датчика?" },
        { from: "Эхо-7", t: "— Я бы с радостью назвал это ошибкой датчика. К сожалению, датчик сейчас демонстрирует редкое единодушие со всеми остальными системами." },
        { n: "В коридоре прокатился глухой удар. Где-то за стеной сорвало крепления оборудования; металлический звон прокатился по корпусу и оборвался треском. Ваше поле зрения расслоилось на тонкие вероятностные линии. Вы увидели три пути: один вёл к креслу и жёсткому удару, второй — к узкому светлому коридору между облаками, третий был почти невидимым, но позволял укрыть Аэ́рхиса собственным светом. Ни одна линия не обещала лёгкого спасения." },
        "— Лиор! Ты видишь выход? Скажи, куда смотреть!"
      ],
      choices: [
        { text: "Навести корабль в светлую полосу между облаками", reqSkill: "Навигация", energyCost: 8, addFlags: ["УВИДЕЛ_ЗЕМЛЮ"], goto: "c01_02" },
        { text: "Предупредить Аэ́рхиса за мгновение до удара", reqSkill: "Интуиция", energyCost: 6, goto: "c01_02" },
        { text: "Приказать ему пристегнуться и принять удар по правилам выживания", reqSkill: "Выживание", hpCost: 2, goto: "c01_02" },
        { text: "Сохранить последние показания в Дневнике наблюдателя", reqItem: "Дневник наблюдателя", addFlags: ["ЗАПИСАЛ_ПАДЕНИЕ"], goto: "c01_02" }
      ]
    },
    c01_02: {
      page: "Стр. 8–10",
      messages: [
        { n: "Удар оказался не похож на столкновение. Сначала исчезли звук и вес, затем вернулись разом — тяжёлым ревом, болью в плечах и ледяным скрежетом металла. «Эхо» вошёл в океан под неверным углом. Вода вздыбилась вокруг корпуса, будто море попыталось сомкнуть над кораблём каменные ладони. Вспышка аварийного света окрасила рубку в красное; через трещину обзорного стекла хлынула мутная вода." },
        { from: "Эхо-7", t: "— Корпус повреждён. Отсек связи затоплен. Давление растёт. Аэ́рхис, покиньте рубку." },
        { from: "Аэ́рхис", t: "— Не уйду без Лиора. Переводи питание на его контур!" },
        { from: "Эхо-7", t: "— Уже сделал. И прежде чем вы скажете, что я не должен был, напомню: у меня осталось слишком мало времени, чтобы спорить." },
        { n: "Ваш свет вспыхнул, отражаясь в струях воды. Вы ощутили, как корабельная память раскрывается перед вами: карты, имена, маршруты, голоса экипажа, первый сигнал, который Аэ́рхис однажды принял от далёкой звезды. Всё это проходило сквозь вас, как множество тонких нитей, и каждая нить рвалась в другом месте. Вы могли сохранить лишь часть. Выбрасывая лишнее, вы теряли не данные — вы теряли мгновения, которые делали их памятью." },
        { sep: true },
        { from: "Эхо-7", t: "— Передаю остаток навигационной карты. Координаты первой звезды. Голосовой архив. И запись, которую Аэ́рхис просил не удалять." },
        { from: "Аэ́рхис", t: "— Какую запись?" },
        { from: "Эхо-7", t: "— Ваш первый разговор после обучения. Вы сказали, что однажды найдёте мир, где никто не будет обязан смотреть на звёзды только по приказу." },
        { n: "На мгновение в рубке стало тихо. Даже океан будто отступил от переборок. Вы запомнили последнюю интонацию Эхо-7 — сухую, чуть насмешливую, с едва заметной теплотой. Потом свет его интерфейса погас. Не постепенно: одним движением, словно кто-то закрыл дверь изнутри. В динамиках остался короткий треск, и корабль перестал отвечать." },
        "— Эхо?.. Ответь. Это приказ. Эхо, пожалуйста.",
        { n: "Аэ́рхис не плакал. Он смотрел на погасшую панель так, будто ждал, что она снова заговорит, если не шевелиться. Вода поднималась к его коленям. Вы ощущали, как страх меняет ритм его дыхания. В глубине вашего корпуса дрогнуло последнее эхо корабельного разума — не голос, а тёплый след, который можно было либо удержать, либо отпустить." }
      ],
      choices: [
        { text: "Сохранить последние слова Эхо-7 в памяти света", energyCost: 10, addFlags: ["ЭХО_ПОМНИТ"], goto: "c01_03" },
        { text: "Помочь Аэ́рхису пережить утрату, разделив его боль", reqSkill: "Эмпатия", o2Cost: 5, goto: "c01_03" },
        { text: "Восстановить обрывок журнала по памяти и записям", reqSkill: "Память", reqItem: "Дневник наблюдателя", addFlags: ["ЭХО_ПОМНИТ"], goto: "c01_03" },
        { text: "Отключить всё лишнее и беречь остаток энергии", energyCost: 0, o2Cost: 2, goto: "c01_03" }
      ]

    c01_03: {
      page: "Стр. 11–13",
      messages: [
        { n: "Океан вошёл в рубку без ярости — просто занял место, которое ему принадлежало по праву глубины. Вода поднялась до груди Аэ́рхиса, холод сжал пальцы и запястья, а каждый вдох стал коротким, болезненным спором с собственным телом. За разбитым иллюминатором мелькали обломки: кусок крыла, оборванный кабель, серебристая пластина с эмблемой Вел’Ноктари. Вокруг не было ни верха, ни низа. Только тёмная толща и редкие пузырьки, уходившие куда-то в невидимую сторону." },
        { from: "Аэ́рхис", t: "— Я не чувствую ног. Лиор, скажи, что я ещё здесь." },
        { n: "Вы ответили светом. Не вспышкой — коротким ровным пульсом, таким, каким учили отмечать присутствие рядом с потерявшим ориентир. Трещины на вашем тёмном теле загорелись мягким янтарным цветом. Аэ́рхис повернул голову, увидел вас и ухватился взглядом за этот свет, как за поручень в темноте." },
        "— Хорошо. Значит, ещё не всё. Считай со мной. Раз. Два...",
        { n: "Но воздух уходил. На панели аварийного костюма цифры таяли слишком быстро, а вокруг плеча Аэ́рхиса дрожала тонкая серебряная нить — граница сознания. Если она оборвётся, вы не сможете вернуть его одним зовом. Свет мог удержать его, но цена была ясна: часть вашего запаса больше не восстановится сама собой." },
        { sep: true },
        { n: "Вы вспомнили наставление старшего хранителя: «Не путай поддержку с жертвой. Иногда лучший способ сохранить наблюдаемое — позволить ему пройти собственный путь». Тогда эти слова казались слишком холодными. Сейчас они звучали почти жестоко. Вы видели другую возможность: дать Аэ́рхису опору, но оставить ему достаточно свободы, чтобы он сам нашёл движение. Решение принадлежало вам, но последствия достанутся вам обоим." },
        { from: "Аэ́рхис", t: "— Не уходи, Лиор. Даже если ничего не можешь сделать — просто останься." },
        { skill: "Медицина", t: "— Дыхание сбивается. Нужно освободить грудную клетку и не дать ему потерять тепло." },
        { flag: "ЭХО_ПОМНИТ", n: "Сохранённые слова Эхо-7 вспыхнули в вашей памяти короткой последовательностью. Среди хаоса вы всё ещё слышали его ровный голос, и это помогало удерживать Аэ́рхиса: потерянный корабль не исчез бесследно, пока его помнили." },
        { noFlag: "ЭХО_ПОМНИТ", n: "Вы потянулись к памяти Эхо-7, но там остались только обрывки шума. Вы не сохранили его последние слова. Эта пустота была неприятнее любой ошибки навигации." },
        { n: "Вы почувствовали, как человеческая жизнь держится на мелочах: на одном вдохе, на точке опоры, на чужом внимании. Ни один архив Андромеды не передавал этого так точно." }
      ],
      choices: [
        { text: "Отдать часть света и удержать сознание Аэ́рхиса", energyCost: 20, addFlags: ["ДЕРЖАЛ_СВЕТ"], goto: "c01_04" },
        { text: "Стабилизировать дыхание и направить его движения", reqSkill: "Медицина", o2Cost: 6, addFlags: ["ДЕРЖАЛ_СВЕТ"], goto: "c01_04" },
        { text: "Унять панику, разделив с ним страх", reqSkill: "Эмпатия", o2Cost: 8, addFlags: ["ДЕРЖАЛ_СВЕТ"], goto: "c01_04" },
        { text: "Сохранить силы и позволить Аэ́рхису бороться самостоятельно", hpCost: 3, o2Cost: 10, goto: "c01_04" }
      ]

    c01_04: {
      page: "Стр. 14–16",
      messages: [
        { n: "Путь к поверхности преграждала переборка. Её край придавил ногу Аэ́рхиса, а ремень удерживал плечо в неудобном положении. Каждая попытка вырваться только сильнее затягивала его под обломок. Вы различали на металле рваные края, натянутые кабели и маленький клапан аварийного сброса. Вокруг медленно поднимался песок, превращая воду в мутное стекло." },
        { from: "Аэ́рхис", t: "— Я застрял. Не могу поднять её. Если рвану сильнее, сломаю ногу." },
        { n: "Вы провели светом вдоль переборки. Для другого существа это выглядело бы случайным мерцанием, но Аэ́рхис знал ваш язык: короткий импульс — смотри, два — не двигайся, длинный — ищи слабое место. Он проследил за бликом и увидел рычаг, который ещё держался на одном креплении." },
        { from: "Аэ́рхис", t: "— Рычаг... Понял. Если освободить фиксатор, переборка уйдёт в сторону." },
        { n: "Сверху донёсся глухой удар. Корабль продолжал оседать, и каждая секунда делала проход уже. Пузырьки уходили вверх вдоль кабельного жгута, указывая направление к пробоине. Вы не знали, сколько времени осталось до полного затопления, но знали другое: паника расходует силы быстрее воды." },
        { sep: true },
        { from: "Аэ́рхис", t: "— Дай мне последовательность. Что сначала?" },
        { n: "У вас были разные способы помочь. Можно было рассчитать путь по движению воды, найти слабину в креплении, вспомнить устройство аварийного узла или приглушить собственное свечение, чтобы не тратить энергию на каждый импульс. Аэ́рхис ждал не приказа — он ждал, чтобы вы увидели то, чего не видел он." },
        { skill: "Ремесло", t: "— Крепление держится на двух штифтах. Один уже вышел из гнезда." },
        { skill: "Навигация", t: "— Пузырьки отклоняются вправо. Там проход к поверхности." },
        { n: "Вы почувствовали, что на этот раз свет нужен не для спасения от тьмы, а для точности. И всё же даже точность не гарантировала мягкого исхода." }
      ],
      choices: [
        { text: "Освободить фиксатор, используя слабое место крепления", reqSkill: "Ремесло", reqItem: "Набор инструментов", goto: "c01_05" },
        { text: "Провести Аэ́рхиса по потоку пузырьков к пробоине", reqSkill: "Навигация", o2Cost: 4, goto: "c01_05" },
        { text: "Собраться и выбраться, пока хватит сил", reqSkill: "Выживание", hpCost: 2, goto: "c01_05" },
        { text: "Погасить лишние контуры света и проскользнуть в узкий проход", reqSkill: "Скрытность", energyCost: 4, goto: "c01_05" }
      ]
    },
    c01_05: {
      page: "Стр. 17–19",
      messages: [
        { n: "Поверхность не открылась сразу. Сначала вода посветлела, затем над головой проступила зыбкая серо-зелёная полоса. Аэ́рхис плыл почти вслепую, отталкиваясь от обломков, и каждый раз, когда его рука касалась холодного металла, вы чувствовали короткий всплеск боли. Наконец он вынырнул. Воздух ударил в лёгкие, ветер обжёг мокрое лицо, а волны подняли его и тут же бросили вниз." },
        { n: "Океан был огромен. Не таким, каким он выглядел на картах — ровной синей поверхностью с аккуратными линиями течений, — а живым и тяжёлым. Вода поднималась длинными спинами, рассыпала пену, с грохотом обрушивалась в провалы между гребнями. Над ней висело низкое небо, и где-то далеко, почти на границе видимости, двигались жёлтые огни. Земной корабль шёл под парусом и мотором, разрезая ночь своим тёплым светом." },
        { from: "Брюн", t: "— На воде человек! Павел, шлюпку! Клим, бросай спасательный круг!" },
        { from: "Павел", t: "— Уже спускаем! Держись, парень! Не глотай волну!" },
        { from: "Тео", t: "— Брюн, рядом с ним ещё светится что-то. Словно стеклянный фонарь, только без огня!" },
        { from: "Маргит Ольсен", t: "— Тише на палубе. Спасаем человека, а не разглядываем чудеса. Тео, спускайся к шлюпке, но не геройствуй." },
        { sep: true },
        { n: "Вы увидели их лица сквозь солёные брызги. Люди были маленькими, хрупкими и невероятно упрямыми: один держал верёвку, другой спорил с ветром, третий прикрывал ладонью фонарь, чтобы свет не бил в глаза тонущему. Их движения не были отточены, как работа экипажа «Эхо», зато в них была странная согласованность — каждый замечал чужую слабость и подхватывал там, где другой не успевал." },
        { from: "Аэ́рхис", t: "— Лиор... Они идут за нами. Я не знаю, кто они. Не знаю, что им сказать." },
        { flag: "ДЕРЖАЛ_СВЕТ", n: "Когда Аэ́рхис поднял голову к шлюпке, он уже не был один на один с холодом. В вашем свечении сохранился ритм, которым вы удерживали его сознание под водой. Люди увидели не просто странный огонёк — они увидели, что этот свет не оставляет человека." },
        { noFlag: "ДЕРЖАЛ_СВЕТ", n: "Аэ́рхис держался на одном упрямстве. Ваш свет был слаб, и он не мог опереться на него так, как прежде. Когда шлюпка приблизилась, вы поняли, что спасение теперь зависит от людей, которых вы ещё не знаете." },
        { n: "Волна накрыла его до подбородка. Шлюпка уже приближалась, но люди ещё не могли видеть, где заканчивается человек и начинается ваш свет. Вы могли открыться сразу, позволить им увидеть вас во всей странности, или скрыть свечение до тех пор, пока Аэ́рхис не окажется на борту. Впервые за время падения выбор касался не только выживания: от него зависело, каким будет ваш первый след в памяти Земли." }
      ],
      onEnter: { addItems: ["Капля тишины"] },
      choices: [
        { text: "Позволить людям увидеть свет и поднять вас вместе с Аэ́рхисом", addFlags: ["ОТКРЫЛСЯ_ЛЮДЯМ"], goto: "c01_06" },
        { text: "Приглушить свечение и скрыться среди обломков", reqSkill: "Скрытность", o2Cost: 3, addFlags: ["СКРЫЛ_ПРАВДУ"], goto: "c01_06" },
        { text: "Подать короткий световой сигнал, чтобы направить шлюпку", reqSkill: "Наблюдение", energyCost: 5, addFlags: ["УВИДЕЛ_ЗЕМЛЮ"], goto: "c01_06" }
      ]
    },
    c01_06: {
      page: "Стр. 20–22",
      messages: [
        { n: "Шлюпка ударилась о волну рядом с Аэ́рхисом. Павел перегнулся через борт и протянул руку, а Клим удерживал его за пояс. Старый боцман Брюн стоял на носу, готовый перерезать канат, если тот запутается в винте. Тео, мокрый до пояса, первым заметил, что Аэ́рхис не может поднять левую руку." },
        { flag: "ОТКРЫЛСЯ_ЛЮДЯМ", n: "Ваш свет не прятался. Он лёг на мокрые борта шлюпки тонкой дорожкой, и матросы увидели, что странный отблеск движется в такт дыханию спасённого. Клим перекрестился, но руку не отдёрнул; Павел лишь крепче ухватился за спасательный конец." },
        { noFlag: "ОТКРЫЛСЯ_ЛЮДЯМ", n: "Вы держали свечение приглушённым. Для матросов Аэ́рхис оставался потерпевшим крушение, а вы — неясной вещью среди обломков. Это давало несколько минут спокойствия, но каждое случайное отражение могло выдать вас." },
        { from: "Павел", t: "— Давай сюда! Не стесняйся, мы тебя вытащим!" },
        { from: "Брюн", t: "— Не тяни за плечо. Клим, подхвати под спину. Тео, держи фонарь ровно!" },
        { from: "Тео", t: "— Я держу! Только он... он светится. Вы это тоже видите?" },
        { n: "На палубе «Морской ласточки» пахло мокрой пенькой, угольным дымом, рыбой и густым супом. Вас внесли под навес, уложили на лавку и накрыли тяжёлым шерстяным одеялом. Аэ́рхис дрожал так сильно, что зубы стучали в такт качке. Кто-то вложил ему в ладони кружку с тёплой водой. Кто-то другой отодвинул любопытных матросов, чтобы вокруг осталось место для воздуха." },
        { from: "Ингрид Вальк", t: "— Не толпитесь. Дайте ему дышать. Брюн, нужна сухая рубашка и одеяло. Клим, проверьте, нет ли у него раны под рёбрами." },
        { from: "Маргит Ольсен", t: "— Я капитан Маргит Ольсен. Это «Морская ласточка». Вы на борту, и пока я здесь, никто не станет сбрасывать вас обратно в море. Теперь ответьте: откуда вы взялись?" },
        { sep: true },
        { n: "Ингрид работала быстро и без суеты. Её пальцы были холодными, но движения — уверенными. Она проверила зрачки Аэ́рхиса, послушала дыхание, осторожно ощупала рёбра. Когда её взгляд упал на Лиор’Саэна, она не отшатнулась. Только задержала руку над вашим корпусом, словно пыталась понять, откуда исходит тепло, которого не должно было быть в куске тёмного стекла." },
        { from: "Ингрид Вальк", t: "— Это устройство? Часть снаряжения? Оно реагирует на него. Смотрите: когда парень дышит ровнее, свет тоже меняется." },
        { from: "Тео", t: "— Я могу отнести его в мастерскую. У нас есть мягкая прокладка и латунная рамка. Ничего не поцарапаю, обещаю." },
        { from: "Маргит Ольсен", t: "— Никто ничего не разбирает. Сначала спасённый человек согреется. Потом поговорим." },
        { flag: "СКРЫЛ_ПРАВДУ", n: "Пока вас несли под навес, вы погасили почти все внешние линии свечения. Но на внутреннем краю корпуса осталась тонкая светлая нить, которую заметил только Тео. Он ничего не сказал — впервые решил, что любопытство может подождать." },
        { n: "Из рубки выглянул радист Лукас — худой мужчина с наушниками на шее и карандашом за ухом. Он держал в руке листок с полосами помех. Пока шлюпка возвращалась, его приёмник поймал странный импульс на частоте, которой не было в судовом расписании. Он не знал, что именно услышал, но не хотел терять запись." },
        { from: "Лукас", t: "— Капитан, в эфире был сигнал. Короткий, будто кто-то постучал по стеклу изнутри. Я сохранил отметку времени." },
        { from: "Маргит Ольсен", t: "— Запишите и уберите в журнал. Сейчас у нас на борту человек, которому нужно тепло, а не допрос." }
      ],
      onEnter: { addItems: ["Целебный отвар"] },
      choices: [
        { text: "Позволить Ингрид осмотреть Лиор’Саэна и не скрывать свет", reqSkill: "Эмпатия", addFlags: ["ИНГРИД_ЗАМЕТИЛА", "ОТКРЫЛСЯ_ЛЮДЯМ"], goto: "c01_07" },
        { text: "Попросить Тео нести вас осторожно, сохранив контакт с Аэ́рхисом", reqSkill: "Ремесло", addFlags: ["ТЕО_ДОВЕРЯЕТ"], goto: "c01_07" },
        { text: "Передать Лукасу слабый ответный импульс", reqSkill: "Наблюдение", energyCost: 5, addFlags: ["ЛУКАС_СОХРАНИЛ_СИГНАЛ"], goto: "c01_07" },
        { text: "Спрятать свечение под одеялом и не привлекать внимания", reqSkill: "Скрытность", o2Cost: 3, addFlags: ["СКРЫЛ_ПРАВДУ"], goto: "c01_07" }
      ]

    c01_07: {
      page: "Стр. 23–25",

  } catch (e) {}
}

/* --- счётчик глав и страниц: читает page из текущего узла STORY_DATA --- */
function pgInfo() {
  const M = STORY_DATA.meta, n = STORY_DATA.nodes[st.node] || {}, C = M.chapters;
  const pgNum = v => { const m = String(v == null ? "" : v).match(/\d+/); return m ? Number(m[0]) : 0; };
  const rg = c => String(c.pages).split(/[–-]/).map(Number), has = (c, pg) => { const [a, b] = rg(c); return pg >= a && pg <= (b || a); };
  const page = pgNum(n.page) || pgNum(st.page) || (C[0] ? rg(C[0])[0] : 0);
  let c = n.chapter ? C.find(x => x.no === n.chapter.no) : null;
  if (!c) c = C.find(x => x.no === st.chap && has(x, page));
  if (!c) c = C.find(x => has(x, page));
  if (!c) c = C.find(x => x.no === st.chap);
  return { page, c, total: M.totalPages };
}
function pgTxt() {
  if (!st) return "";
  const { page, c, total } = pgInfo(); if (!c || !page) return "";
  return (c.no > 19 ? "Эпилог" : "Глава " + c.no) + " · Стр. " + page + " / " + total;

}

/* --- заставка, пролог --- */
const M = STORY_DATA.meta, CRED = "Авторская книга-игра · " + M.author;
document.title = M.title + " — авторская книга-игра";
$("#ldT").textContent = M.title; $("#ldA").textContent = CRED; $("#spT").textContent = M.title; $("#spS").textContent = M.sub; $("#spB").textContent = M.blurb; $("#spF").textContent = M.facts; $("#spA").textContent = CRED;
$("#credA").textContent = $("#credG").textContent = M.title + " · " + CRED;
function snow() {
  const c = $("#snow"), x = c.getContext("2d"), W = c.width = c.parentNode.clientWidth, H = c.height = c.parentNode.clientHeight;
  const p = Array.from({ length: 70 }, () => ({ x: Math.random() * W, y: Math.random() * H, r: Math.random() * 1.8 + .4, v: Math.random() * .25 + .05, ph: Math.random() * 6.3, sp: Math.random() * .03 + .01, col: Math.random() < .3 ? "214,184,255" : "143,184,255" }));
  (function f() { if (!$("#splash").classList.contains("on")) return; x.clearRect(0, 0, W, H);
    p.forEach(q => { q.ph += q.sp; q.y -= q.v; q.x += Math.sin(q.ph) * .15; if (q.y < -4) { q.y = H + 4; q.x = Math.random() * W; }
      const a = .25 + .75 * Math.abs(Math.sin(q.ph * 1.7)); x.fillStyle = "rgba(" + q.col + "," + a.toFixed(2) + ")"; x.shadowColor = "rgba(" + q.col + ",.9)"; x.shadowBlur = q.r * 5;
      x.beginPath(); x.arc(q.x, q.y, q.r, 0, 6.3); x.fill(); }); requestAnimationFrame(f); })();
}
function boot() {
  const L = STORY_DATA.meta.bootLines; let i = 0;
  const t = setInterval(() => { $("#ldlog").textContent = L[i] || ""; $("#ldbar").style.width = Math.min(100, (i + 1) / L.length * 100) + "%"; i++; if (i > L.length) { clearInterval(t); show("splash"); snow(); } }, 650);
}
function prologue() {
  show("prologue"); const b = $("#pr"); b.innerHTML = "";
  M.prologue.forEach(t => {
    const p = document.createElement("p");
    p.className = "pp"; p.style.animation = "none"; p.style.opacity = "1";
    p.textContent = t; b.append(p);
  });
  const go = $("#prGo"); go.style.animation = "none"; go.style.opacity = "1"; go.style.animationDelay = "0s";
  $("#prologue .in").scrollTop = 0;
}
$("#spGo").onclick = () => { sfx.click(); prologue(); };
$("#spCont").onclick = () => $("#cont").onclick();
$("#prGo").onclick = () => { sfx.click(); show("setup"); };
refresh(); drawSetup(); boot();
</script></body></html>
